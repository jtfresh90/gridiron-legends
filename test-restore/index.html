  h+=`<div class="li"><span class="wk">${g.po?'PO':'W'+(i+1)}</span>${g.h===u?'vs':'at'} ${lg(o,22)} ${rk(o)}${esc(o.name)} ${g.played?`<b class="${us>th?'win':us<th?'loss':''}">${us>th?'W':us<th?'L':'T'} ${us}-${th}${g.ot?' OT':''}</b>`:''}${g.po?` <span class="dim">${esc(g.lab)}</span>`:''}</div>`;});
 h+=`</div><div class="card"><h3>League scoreboard</h3><select data-c="wk">${L.schedule.map((w,i)=>`<option value="${i}"${i===wsel?' selected':''}>${w[0]&&w[0].po?esc((w.find(g=>g.grp!=null)||w[0]).lab):'Week '+(i+1)}</option>`).join('')}</select>`;
 for(const g of L.schedule[wsel]||[]){const H=L.teams[g.h],A=L.teams[g.a];h+=`<div class="li sm">${g.po?`<span class="dim">${esc(g.lab)}: </span>`:''}${lg(A,18)} ${rk(A)}${esc(A.name)} ${g.played?`<b>${g.as}</b>`:''} ${g.neutral?'vs':'at'} ${lg(H,18)} ${rk(H)}${esc(H.name)} ${g.played?`<b>${g.hs}</b>${g.ot?' OT':''}`:''}</div>`;}
 return h+'</div>';};
const stTable=(ts,conf)=>`<table class="tb"><tr><th></th><th class="l">Team</th><th>W</th><th>L</th>${L.rulesId!=='college'?'<th>T</th>':''}${conf?'<th>Conf</th>':''}<th>PF</th><th>PA</th></tr>${ts.map((t,i)=>`<tr class="${t.id===L.userTid?'me':''}"><td>${i+1}</td><td class="l">${lg(t,18)} ${esc(t.name)}${L.post&&L.post.seed&&L.post.seed[t.id]?` <i class="rk">${L.post.seed[t.id]}</i>`:''}</td><td>${t.w}</td><td>${t.l}</td>${L.rulesId!=='college'?`<td>${t.t}</td>`:''}${conf?`<td>${t.cw}-${t.cl}</td>`:''}<td>${t.pf}</td><td>${t.pa}</td></tr>`).join('')}</table>`;
TAB.stand=()=>{let h='';
 if(L.post&&L.schedule.length>L.regWeeks){h+=`<div class="card"><h3>Postseason</h3>`;L.schedule.slice(L.regWeeks).forEach(wk=>{for(const g of wk){if(g.bowl&&g.h!==L.userTid&&g.a!==L.userTid)continue;const H=L.teams[g.h],A=L.teams[g.a],sd=id=>L.post.seed[id]&&g.grp!=null?`<i class="rk">${L.post.seed[id]}</i> `:'';h+=`<div class="li sm"><span class="dim">${esc(g.lab)}:</span> ${sd(A.id)}${esc(A.name)} ${g.played?`<b>${g.as}</b>`:''} – ${sd(H.id)}${esc(H.name)} ${g.played?`<b>${g.hs}</b>`:''}</div>`;}});h+='</div>';}
 if(L.mode==='college'){const bcs=L.playoff==='bcs';h+=`<div class="card"><h3>${bcs?'BCS-style standings':'Top 25'}</h3><table class="tb"><tr><th></th><th class="l">Team</th><th>Rec</th>${bcs?'<th>Poll</th><th>Comp</th><th>Avg</th>':''}</tr>${L.rank.slice(0,25).map((id,i)=>{const t=L.teams[id],r=L.rk[id];return `<tr class="${id===L.userTid?'me':''}"><td>${i+1}</td><td class="l">${lg(t,18)} ${esc(t.name)}</td><td>${E.rec(t)}</td>${bcs?`<td>${r.poll}</td><td>${r.comp}</td><td>${r.bcs.toFixed(1)}</td>`:''}</tr>`;}).join('')}</table></div>`;
  const ci=view.conf==null?L.teams[L.userTid].conf:view.conf;h+=`<div class="card"><h3>Conference standings</h3><select data-c="conf">${L.confs.map((c,i)=>`<option value="${i}"${i===ci?' selected':''}>${esc(c.name)}</option>`).join('')}</select>${stTable(L.teams.filter(t=>t.conf===ci).sort(E.confSort),true)}</div>`;}
 else L.confs.forEach((c,ci)=>{h+=`<div class="card"><h3>${esc(c.name)}</h3>`;c.divs.forEach((d,di)=>{h+=`<h4>${esc(d)}</h4>`+stTable(L.teams.filter(t=>t.conf===ci&&t.div===di).sort(E.stSort));});h+='</div>';});
 return h;};
function rosterTable(t,fr){const d=E.depth(t);let h=`<div class="card"><div class="row"><button class="chip" data-a="autodepth">Auto-sort depth chart</button><button class="chip" data-a="addplayer">+ Add player</button>${fr?'':'<button class="chip" data-a="xros">⬇ Roster (Excel)</button><button class="chip" data-a="iros">⬆ Roster (Excel or CSV)</button>'}</div><p class="dim">${t.roster.length} players · tap a player to edit name, number, ratings, body and equipment. The top players at each position start.</p><table class="tb ros"><tr><th>Pos</th><th>#</th><th class="l">Name</th><th>${t.roster[0]&&t.roster[0].yr?'Yr':'Age'}</th><th>OVR</th><th>POT</th><th></th></tr>`;
 for(const pos of E.POS)d[pos].forEach((p,i)=>{h+=`<tr class="${i<E.STARTERS[pos]?'st':''}" data-a="pl" data-v="${p.id}"><td>${pos}${i<E.STARTERS[pos]?'':'<small>'+(i+1)+'</small>'}</td><td>${p.num}</td><td class="l">${esc(p.n)}</td><td>${p.yr?yrN[p.yr]:p.age}</td><td><b>${p.ovr}</b></td><td>${p.pot}</td><td>${i>0?`<button class="mini" data-a="depthup" data-v="${p.id}">▲</button>`:''}</td></tr>`;});
 return h+'</table></div>';}
TAB.roster=()=>{const tid=view.rt==null?L.userTid:view.rt,t=L.teams[tid];return `<div class="card"><label>Team</label><select data-c="rt">${L.teams.map(x=>`<option value="${x.id}"${x.id===tid?' selected':''}>${esc(x.name)}</option>`).join('')}</select>${L.mode==='pro'?`<p class="dim">Payroll $${E.payroll(t)}M of $${L.cap}M cap</p>`:''}</div>`+rosterTable(t,true);};
TAB.team=()=>{const tid=view.et==null?L.userTid:view.et;return `<div class="card"><label>Editing</label><select data-c="et">${L.teams.map(x=>`<option value="${x.id}"${x.id===tid?' selected':''}>${esc(x.name)} ${esc(x.mascot)}</option>`).join('')}</select></div>`+teamEditor(L.teams[tid]);};
const SCAT=[['py','Passing'],['ry','Rushing'],['recy','Receiving'],['tk','Tackles'],['sk','Sacks'],['int','Interceptions']];
TAB.stats=()=>{const k=view.stat,ld=E.leaders(L,k,20);return `<div class="card"><div class="row">${chips('stat',k,SCAT)}</div><table class="tb"><tr><th></th><th class="l">Player</th><th class="l">Team</th><th>${SCAT.find(s=>s[0]===k)[1]}</th><th class="l">Line</th></tr>${ld.map((x,i)=>`<tr class="${x.t.id===L.userTid?'me':''}"><td>${i+1}</td><td class="l">${esc(x.p.n)} <small>${x.p.pos}</small></td><td class="l">${esc(x.t.abbr)}</td><td><b>${x.p.s[k]}</b></td><td class="l dim">${esc(E.seasonLine(x.p))}</td></tr>`).join('')||'<tr><td colspan="5" class="dim">No stats yet — play a week.</td></tr>'}</table></div>`;};
TAB.office=()=>L.mode==='college'?recruiting():frontOffice();
function recruiting(){if(L.phase!=='regular')return'<div class="card">Recruiting reopens when the new season starts.</div>';const used=L.recruits.reduce((s,r)=>s+(r.com<0?r.al:0),0),bud=E.recruitBudget(L),mine=L.recruits.filter(r=>r.com===L.userTid),pos=view.rpos;
 let h=`<div class="card"><h3>Recruiting board</h3><p class="dim">Spend weekly points on prospects and offer scholarships. A recruit commits when interest reaches 100 and you lead. Points: <b>${used}</b> / ${bud} · Class: <b>${mine.length}</b> / 16</p><div class="row">${chips('rpos',pos,[['','All']].concat(E.POS.map(p=>[p,p])))}</div>
 ${mine.length?`<p><b>Committed:</b> ${mine.map(r=>`${'★'.repeat(r.stars)} ${r.p.pos} ${esc(r.p.n)}`).join(' · ')}</p>`:''}<table class="tb"><tr><th>★</th><th>Pos</th><th class="l">Name</th><th>Interest</th><th>Rival</th><th>Pts</th><th>Offer</th></tr>`;
 let n=0;L.recruits.forEach((r,i)=>{if(r.com>=0||(pos&&r.p.pos!==pos)||n>=60)return;n++;h+=`<tr><td class="gold">${'★'.repeat(r.stars)}</td><td>${r.p.pos}</td><td class="l">${esc(r.p.n)} <small>${Math.floor(r.p.ht/12)}'${r.p.ht%12}" ${r.p.wt}</small></td><td><div class="bar"><i style="width:${Math.min(100,r.int)}%"></i></div></td><td><div class="bar riv"><i style="width:${Math.min(100,r.lp)}%"></i></div><small>${esc(L.teams[r.lead].abbr)}</small></td>
  <td class="nw"><button class="mini" data-a="ral" data-v="${i}" data-d="-5">−</button> ${r.al} <button class="mini" data-a="ral" data-v="${i}" data-d="5">+</button></td><td><button class="mini ${r.off?'on':''}" data-a="roff" data-v="${i}">${r.off?'Offered':'Offer'}</button></td></tr>`;});
 return h+'</table></div>';}
function frontOffice(){const u=L.teams[L.userTid];let h=`<div class="card"><div class="row">${chips('off',view.off,[['trade','Trades'],['fa','Free agents']])}</div><p class="dim">Payroll $${E.payroll(u)}M of $${L.cap}M · Roster ${u.roster.length}/55</p></div>`;
 if(view.off==='fa'){h+=`<div class="card"><table class="tb"><tr><th>Pos</th><th class="l">Name</th><th>Age</th><th>OVR</th><th>$M</th><th></th></tr>${L.fa.slice(0,60).map((p,i)=>`<tr><td>${p.pos}</td><td class="l">${esc(p.n)}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${p.c.sal}</td><td><button class="mini" data-a="signfa" data-v="${i}">Sign</button></td></tr>`).join('')}</table></div>`;return h;}
 const tt=view.tt==null?(L.userTid===0?1:0):view.tt,B=L.teams[tt],s=view.tsel,row=(p,side)=>`<tr class="${s[p.id]?'me':''}" data-a="tsel" data-v="${p.id}"><td>${s[p.id]?'☑':'☐'}</td><td>${p.pos}</td><td class="l">${esc(p.n)}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${Math.round(E.tradeValue(p))}</td></tr>`;
 const hd='<tr><th></th><th>Pos</th><th class="l">Name</th><th>Age</th><th>OVR</th><th>Value</th></tr>';
 return h+`<div class="card"><label>Trade partner</label><select data-c="tt">${L.teams.filter(t=>t.id!==L.userTid).map(t=>`<option value="${t.id}"${t.id===tt?' selected':''}>${esc(t.name)} (${E.rec(t)})</option>`).join('')}</select><button class="big gold" data-a="trade">PROPOSE TRADE</button>
 <div class="two"><div><h4>You send</h4><table class="tb">${hd}${u.roster.map(p=>row(p)).join('')}</table></div><div><h4>${esc(B.name)} send</h4><table class="tb">${hd}${B.roster.map(p=>row(p)).join('')}</table></div></div></div>`;}
function offseason(){const O=L.off,u=L.teams[L.userTid],pro=L.mode==='pro';let h=`<div class="card"><div class="tag">OFFSEASON · STEP ${O.step+1} OF ${pro?3:2}</div>`;
 if(O.step===0){h+=`<h3>Departures</h3>${O.left.map(x=>`<div class="li sm">${esc(x)}</div>`).join('')||'<p class="dim">Nobody left the program.</p>'}`;
  if(pro){h+=`<h3>Expiring contracts</h3>${O.expiring.map(id=>{const p=u.roster.find(p=>p.id===id);return p?`<div class="li"><span class="grow">${p.pos} ${esc(p.n)} · ${p.ovr} OVR · age ${p.age} · asks $${(E.salary(p)*1.1).toFixed(1)}M</span><button class="mini" data-a="resign" data-v="${id}" data-d="1">Re-sign</button> <button class="mini" data-a="resign" data-v="${id}" data-d="0">Release</button></div>`:'';}).join('')||'<p class="dim">No decisions left. Unsigned players leave when you continue.</p>'}`;}
  else h+=`<h3>Signing class (${O.signed.length})</h3>${O.signed.map(r=>`<div class="li sm"><span class="gold">${'★'.repeat(r.stars)}</span> ${r.pos} ${esc(r.n)} · ${r.ovr} OVR</div>`).join('')||'<p class="dim">No recruits signed. Spend recruiting points during the season.</p>'}<p class="dim">Program prestige is now ${u.prestige}.</p>`;}
 else if(O.step===1&&pro){const D=L.draft,n=L.teams.length,done=E.draftDone(L);h+=`<h3>Draft${done?' complete':` · Round ${Math.floor(D.i/n)+1}, pick ${D.i%n+1}`}</h3>`;
  if(!done)h+=`<div class="row"><button class="chip" data-a="draftauto">Auto-draft the rest</button></div><p><b>You are on the clock.</b></p><table class="tb"><tr><th>Pos</th><th class="l">Name</th><th>Age</th><th>OVR</th><th>POT</th><th></th></tr>${D.pool.slice(0,40).map((p,i)=>`<tr><td>${p.pos}</td><td class="l">${esc(p.n)}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${p.pot}</td><td><button class="mini" data-a="draft" data-v="${i}">Draft</button></td></tr>`).join('')}</table>`;
  h+=`<h4>Recent picks</h4>${D.log.slice(0,10).map(x=>`<div class="li sm ${x.tid===u.id?'win':''}">R${x.r} #${x.k} ${esc(L.teams[x.tid].abbr)} — ${x.pos} ${esc(x.n)} (${x.ovr})</div>`).join('')}`;}
 else if(pro){h+=`<h3>Free agency</h3><p class="dim">Payroll $${E.payroll(u)}M of $${L.cap}M · Roster ${u.roster.length}/55</p><table class="tb"><tr><th>Pos</th><th class="l">Name</th><th>Age</th><th>OVR</th><th>$M</th><th></th></tr>${L.fa.slice(0,50).map((p,i)=>`<tr><td>${p.pos}</td><td class="l">${esc(p.n)}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${p.c.sal}</td><td><button class="mini" data-a="signfa" data-v="${i}">Sign</button></td></tr>`).join('')}</table>`;}
 else h+=`<h3>Transfer portal</h3><p class="dim">Pitch up to three transfers (${3-O.portalUsed} left). Better programs land better players.</p><table class="tb"><tr><th>Pos</th><th class="l">Name</th><th>Yr</th><th>OVR</th><th></th></tr>${O.portal.map((p,i)=>`<tr><td>${p.pos}</td><td class="l">${esc(p.n)}</td><td>${yrN[p.yr]}</td><td><b>${p.ovr}</b></td><td><button class="mini" data-a="portal" data-v="${i}">Pitch</button></td></tr>`).join('')}</table>`;
 const lastStep=O.step>=(pro?2:1);return h+`<button class="big gold" data-a="offnext">${lastStep?'START '+(L.year+1)+' SEASON':'CONTINUE'}</button></div>`;}

function paint(){for(const c of app.querySelectorAll('canvas[data-paint]')){const k=c.dataset.paint,x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);
  if(k==='kit'){const t=c.dataset.t!=null?EXT[+c.dataset.t]:editTeam();Art.kit(x,t,c.dataset.home==='1',c.width,c.height,null);}
  else if(k==='pkit'){const t=editTeam(),p=findP(t,view.pid);if(p)Art.kit(x,t,true,c.width,c.height,p.num,p);}
  else if(k==='fig'){const t=editTeam(),p=findP(t,view.pid);if(p)Art.figure(x,t,p,c.width,c.height);}
  else if(k==='logo'){const t=editTeam();Art.logo(x,t,c.width/2,c.height/2,c.width/2-6);}
  else if(k==='field'){const big=document.createElement('canvas');big.width=512;big.height=1024;Art.field(big,editTeam(),E.RULES[view.prules||'pro']);x.drawImage(big,0,0,c.width,c.height);}
  else if(k==='cover'){const n=L.news[+c.dataset.i],t=L.teams[+c.dataset.t];let star=null;if(n&&n.cover&&n.cover.star){const s=n.cover.star,st=L.teams[s.tid],p=st&&st.roster.find(p=>p.id===s.pid);star={n:s.n,num:p?p.num:null,p};if(st&&st.id!==t.id)star.num=null;}Art.cover(c,t,star);}}}
function render(){if(running)return;const sy=scr===render.ls&&tab===render.lt?(document.scrollingElement||document.documentElement).scrollTop:0;app.innerHTML=SC[scr]();paint();render.ls=scr;render.lt=tab;(document.scrollingElement||document.documentElement).scrollTop=sy;}
function go(s){scr=s;view.pid=null;render();}

  const wxl=sd.roof?'We are indoors under the roof today.':sd.wx==='rain'?'It is a wet one, so ball security will matter.':sd.wx==='snow'?'Snow is falling and footing will be tricky.':sd.time==='night'?'It is a clear night under the lights.':sd.time==='dusk'?'The sun is going down on a perfect evening for football.':'It is a beautiful afternoon for football.';
  steps.push({cine:'orbit',dur:7.5,cap:`Welcome to ${sd.name}, where the ${Aw.name} ${Aw.mascot} visit the ${H.name} ${H.mascot}. ${wxl}`});
  steps.push({cine:'mid',dur:8,card:`<div class="tag">TALE OF THE TAPE</div><div class="fs"><div>${lg(Aw,44)}<b>${esc(Aw.name)}</b><i>${E.teamOvr(Aw)}</i></div><div>${lg(H,44)}<b>${esc(H.name)}</b><i>${E.teamOvr(H)}</i></div></div><table class="tb box"><tr><td>${E.offOvr(Aw)}</td><th>Offense</th><td>${E.offOvr(H)}</td></tr><tr><td>${E.defOvr(Aw)}</td><th>Defense</th><td>${E.defOvr(H)}</td></tr>${Aw.w+Aw.l+H.w+H.l?`<tr><td>${E.rec(Aw)}</td><th>Record</th><td>${E.rec(H)}</td></tr>`:''}</table>`,
   cap:`${H.name} come in rated ${E.teamOvr(H)} overall${qb?', led by quarterback '+qb.n:''}. ${Aw.name} counter with ${PN[st.pos]} ${st.n}, their top-rated player.`});
  steps.push({cine:'side',dur:5.5,cap:`We are playing ${ru.name} rules today: ${ru.downs} downs and ${ru.n} men a side. Let us head to midfield for the coin toss.`});steps.push({toss:1,cine:'toss',dur:1e9,cap:''});}
 else{const a=S.score[0],b=S.score[1],ld=a>=b?H:Aw,tr=a>=b?Aw:H,hi=Math.max(a,b),lo=Math.min(a,b),fin=kind==='final',tm=S.tm,star=starOf(),hl=G.highlights(kind);
  const l1=fin?(hi===lo?`It ends level at ${hi} apiece here at ${H.stad.name}.`:`That is the final from ${H.stad.name}. ${ld.name} ${hi}, ${tr.name} ${lo}.`):(hi===lo?`We are all square at ${hi} at the half.`:`At the half, ${ld.name} lead ${tr.name} ${hi} to ${lo}.`);
  const l2=`${H.name} ${fin?'finished with':'have'} ${tm[0].yds} total yards to ${tm[1].yds} for ${Aw.name}${tm[0].to+tm[1].to?`, with ${tm[0].to+tm[1].to} turnover${tm[0].to+tm[1].to>1?'s':''} in the game`:''}.`;
  steps.push({cine:'orbit',dur:9,card:statCard(fin?'FINAL REPORT':'HALFTIME REPORT'),cap:l1+' '+l2+(star?` ${star.p.n} ${fin?'was':'has been'} the story for ${star.t.name}: ${E.lineFor(star.p,star.s)}.`:'')});
  const lead=['Here is the play that changed things.','Take another look at this one.','And this was a big moment.'];
  hl.forEach((r,i)=>steps.push({rec:r,dur:r.frames.length*.066/.65+1.3,card:`<div class="tag">REPLAY · ${ql(r.q).toUpperCase()}${r.q<=4?' · '+ck(r.clock):''}</div>`,cap:`${lead[i%3]} ${ql(r.q)[0].toUpperCase()+ql(r.q).slice(1)}${r.q<=4?', '+ck(r.clock)+' on the clock':''}. ${r.cap.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase())}${r.sub?': '+r.sub:''}.`}));
  steps.push({cine:'mid',dur:4.5,cap:fin?(hi===lo?'Nothing to separate them today. Thanks for joining us.':`${ld.name} get it done. Thanks for joining us.`):'Two quarters still to play. The second half is next.'});}
 PR={steps,i:-1,t:0,cb,cut:true};pres.hidden=false;hud.classList.add('pres');sheet.hidden=true;nextStep();}
function setCap(x){pres.querySelector('.pcap span').textContent=x;Voice.say(x);}
function pbtns(labels,cb){const b=pres.querySelector('.pbtns');b.innerHTML=labels?labels.map((l,i)=>`<button data-i="${i}">${l}</button>`).join(''):'';b.onclick=labels?e=>{const t=e.target.closest('[data-i]');if(t){e.stopPropagation();A.init();cb(+t.dataset.i);}}:null;}
function nextStep(){if(!PR)return;PR.i++;PR.t=0;PR.cut=true;TS=null;pbtns(null);const s=PR.steps[PR.i];if(!s)return endPres();const c=pres.querySelector('.pcard');c.innerHTML=s.card||'';c.hidden=!s.card;if(s.toss)return startToss();setCap(s.cap);}
let TS=null;
function startToss(){G.tossScene();const TM=G.teams();TS={st:'call',t:0,call:null,heads:Math.random()<.5,win:null,auto:null};setCap(`The captains are at midfield with the referee. ${TM[1].name} are the visitors, so they call it in the air.`);if(G.user()===1)pbtns(['HEADS','TAILS'],i=>tossCall(i===0));else TS.auto=2.6;}
function tossCall(h){const TM=G.teams();G.refToss();TS.call=h;TS.st='flip';TS.t=0;TS.auto=null;pbtns(null);setCap(`${TM[1].name} call ${h?'heads':'tails'}. The coin is in the air.`);}
function tossPick(i){const TM=G.teams(),w=TS.win;G.setOpenKick(i===0?1-w:w);TS.st='done';TS.t=0;pbtns(null);setCap(i===0?`${TM[w].name} will receive the opening kickoff.`:i===1?`${TM[w].name} choose to kick off.`:`${TM[w].name} defer to the second half, so ${TM[1-w].name} will receive.`);}
function tossFrame(dt){const TM=G.teams(),UT=G.user();TS.t+=dt;
 if(TS.st==='call'&&TS.auto&&TS.t>TS.auto)tossCall(Math.random()<.5);
 else if(TS.st==='flip'&&TS.t>1.9){TS.st='res';TS.t=0;TS.win=TS.call===TS.heads?1:0;setCap(`It is ${TS.heads?'heads':'tails'}. ${TM[TS.win].name} win the toss.`);if(TS.win===UT)pbtns(['RECEIVE','KICK OFF','DEFER'],tossPick);else TS.auto=2.6;}
 else if(TS.st==='res'&&TS.auto&&TS.t>TS.auto)tossPick(Math.random()<.65?2:0);
 else if(TS.st==='done'&&TS.t>3)nextStep();
 return TS?(TS.st==='call'?null:TS.st==='flip'?TS.t:2):null;}
function endPres(){if(!PR)return;const cb=PR.cb;PR=null;TS=null;pbtns(null);pres.hidden=true;hud.classList.remove('pres');Voice.stop();cb();}
pres.addEventListener('click',e=>{A.init();if(e.target.closest('#pskip'))endPres();else if(PR&&!PR.steps[PR.i].toss)nextStep();});
function startGame(cfg){cur=cfg;cfg.league=scr==='hub';A.init();A.loud();
 if(!V.ok&&!V.init(cv)){toast('The 3D engine could not start on this device, so the game was simulated instead.');G.start(Object.assign({},cfg,{user:-1,headless:true}));const r=G.simToEnd();cur=null;return cfg.onEnd(cfg.league?r:null);}
 app.hidden=true;hud.hidden=false;document.body.classList.add('ingame');fin.hidden=true;pm.hidden=true;sheet.hidden=true;mtr.hidden=true;meter=null;audOpen=false;bugKey=uiKey='';{const d=sget('gl_detail');V.setDetail(d==null?2:+d);V.setCam(sget('gl_cam')||'std');pm.querySelector('[data-p=detail]').textContent='Graphics: '+GFX[V.detail];pm.querySelector('[data-p=cam]').textContent='Camera: '+CAMN[V.cam];V.setMocap(sget('gl_mocap')!=='0');pm.querySelector('[data-p=mocap]').textContent='Players: '+(V.mocap?'Motion capture':'Simple');cfg.defCam=sget('gl_dcam')==='def'?'def':'off';pm.querySelector('[data-p=dcam]').textContent='Defense camera: '+(cfg.defCam==='def'?'Behind defense':'Behind offense');}PR=null;pres.hidden=true;hud.classList.remove('pres');cfg.present=true;cfg.stadGlb=cfg.home.stad.model&&STAD[cfg.home.stad.model.id]||null;if(window.innerHeight>window.innerWidth)setTimeout(()=>toast('Tip: turn your phone sideways for a wider view of the field.'),1500);
 for(let i=0;i<2;i++){const t=cfg[i?'away':'home'],e=$('#b'+i);e.style.setProperty('--c',t.c1);e.querySelector('b').textContent=t.abbr;e.querySelector('span').innerHTML=lg(t,26);}
 Art.ready([cfg.home.logo.img,cfg.away.logo.img,cfg.home.field.img].concat([cfg.home,cfg.away].flatMap(t=>[(t.kit||{}).hImg,(t.kit||{}).jImg,(t.kit||{}).pImg,(t.kit||{}).jTex,(t.stad||{}).rib,(t.field||{}).pad])),()=>{V.resize();V.build(cfg);G.start(Object.assign({hud:HUDI,runoff:cfg.qLen>=15?32:cfg.qLen>=10?24:cfg.qLen>=6?18:14},cfg));running=true;paused=false;last=performance.now();raf=requestAnimationFrame(frame);
  HUDI.banner(cfg.away.name.toUpperCase()+' AT '+cfg.home.name.toUpperCase(),cfg.home.stad.name+' · '+cfg.rules.name+' rules');});}
function endGame(res){PR=null;pres.hidden=true;Voice.stop();running=false;cancelAnimationFrame(raf);hud.hidden=true;app.hidden=false;document.body.classList.remove('ingame');A.quiet();const c=cur;cur=null;if(c&&c.onEnd)c.onEnd(res);}
window.addEventListener('resize',()=>V.resize());

/* live 3D model preview in the editors */
let pvYaw=Math.PI+.5,pvDrag=null,pvLast=0,pvFail=false;
function pvLoop(ts){requestAnimationFrame(pvLoop);const ms=$('#mst');if(ms&&ts-pvLoop.t>700){pvLoop.t=ts;ms.textContent='Player models: '+V.mocapStatus;}if(running||pvFail)return;const cs=app.querySelectorAll('canvas.p3d');if(!cs.length)return;const dt=Math.min(.05,Math.max(0,(ts-pvLast)/1000));pvLast=ts;if(pvDrag==null)pvYaw+=dt*.45;
 if(!V.ok&&!V.init(cv)){pvFail=true;return;}
 try{for(const c of cs){if(c.id==='s3d'){const t=editTeam();if(t)V.stadPreview(c,t,E.RULES[view.prules||'pro'],pvYaw*.6);continue;}let t,p,home=true;
   if(c.dataset.t!=null){t=EXT[+c.dataset.t];home=c.dataset.home==='1';p=t&&(E.depth(t).QB[0]||t.roster[0]);}else{t=editTeam();if(!t)continue;if(c.id==='p3d')p=findP(t,view.pid);else{p=t.roster[0];home=view.khome!==0;}}
   if(t&&p)V.preview(c,t,p,home,pvYaw,dt,c.id||('x'+c.dataset.home));}}catch(e){pvFail=true;}}
pvLoop.t=0;
app.addEventListener('pointerdown',e=>{if(e.target.classList&&e.target.classList.contains('p3d')){pvDrag=e.clientX;e.preventDefault();}});
window.addEventListener('pointermove',e=>{if(pvDrag!=null){pvYaw+=(e.clientX-pvDrag)*.012;pvDrag=e.clientX;}});window.addEventListener('pointerup',()=>{pvDrag=null;});window.addEventListener('pointercancel',()=>{pvDrag=null;});
/* ================= boot ================= */
function boot(){const s=sget(SAVE);if(s){try{L=E.unpack(s);}catch(e){L=null;}}const x=sget(EXS);if(x){try{EXT=E.unpack(x);}catch(e){EXT=null;}}if(!EXT||!EXT.length)EXT=E.exhibitionTeams('pro');
 let t=0;Art.onload=()=>{clearTimeout(t);t=setTimeout(()=>{if(!running&&!app.querySelector('input:focus'))render();},60);};
 setTimeout(()=>{try{if(!V.ok)V.init(cv);}catch(e){}},400);IDB.open().then(()=>IDB.all((k,v)=>{STAD[k]=v;if(k==='bodytex'&&typeof v==='string')setBody(v,false);if(k==='font'&&typeof v==='string')loadFont(v);if(k==='boardmedia'&&v&&v.type)setBoardMedia(v);}));Voice.init();render();requestAnimationFrame(pvLoop);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const tm of EXT)delete tm._lgk;if(L)for(const tm of L.teams)delete tm._lgk;render();});}
boot();
return {render,state:()=>({L,EXT,scr,tab,view}),act:ACT,packGlb};
})();
