 for(const t of list.slice().sort((a,b)=>ord(a)-ord(b)||(a.name+a.mascot).localeCompare(b.name+b.mascot))){const [lg,cn,dn]=key(t),lab=[lg?LGN(lg):'',cn,dn].filter(Boolean).join(' · ')||'Teams';if(!G.has(lab))G.set(lab,[]);G.get(lab).push(t);}return G;}

function draftToPlay(D,id){const P={id:id||('my'+Date.now().toString(36)),lv:D.lv||'pcf',name:(D.name||'My Play').slice(0,26),form:D.form,draft:JSON.parse(JSON.stringify(D))};
 if(D.kind==='pass'){P.type='pass';P.pa=!!D.pa;P.routes={};for(const r in D.routes)if(D.routes[r]&&D.routes[r]!=='block')P.routes[r]=D.routes[r];P.desc=(G.FORM_N[D.form]||D.form)+' · your pass play';}
 else if(D.kind==='opt'){P.type='run';P.opt=D.opt;P.side=D.side;if(D.opt==='triple'&&!G.FORMS[D.form].some(f=>f[0]==='FB'))P.form='flex';if(D.opt==='read')P.hole=[-D.side*1.5,.5];P.desc=(G.FORM_N[P.form]||P.form)+' · your '+({read:'zone read',speed:'speed option',triple:'triple option'})[D.opt];}
 else{P.type='run';const h=HOLES.find(x=>x[0]===D.hole)||HOLES[2];P.hole=[h[2],.5];if(D.hand==='toss'){P.toss=1;P.hole=[h[2]*1.1,0];}if(D.hand==='delay')P.delay=.45;if(D.hand==='qb'){P.opt='qb';}P.desc=(G.FORM_N[D.form]||D.form)+' · '+h[1].toLowerCase()+(D.hand==='toss'?' toss':D.hand==='delay'?' draw':D.hand==='qb'?' QB run':' handoff');}
 return P;}
function drawPlay(x,w,h,D){const P=draftToPlay(D),F=(G.FORMS[P.form]||G.FORMS.gun).slice();if(!G.N12[P.form]&&(D.lv==='f'))F.push(['Y','WR',3,6.5,-2]);const sc=w/56,cx=w/2,ly=h*.8,X=v=>cx+v*sc,Y=v=>ly-v*sc;
 x.fillStyle='#2d7a34';x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;for(let yd=-10;yd<=30;yd+=5){x.beginPath();x.moveTo(0,Y(yd));x.lineTo(w,Y(yd));x.stroke();}
 x.strokeStyle='#7fb2ff';x.lineWidth=2;x.beginPath();x.moveTo(0,ly);x.lineTo(w,ly);x.stroke();
 const pos={},dot=(px,py,c,t)=>{x.fillStyle=c;x.beginPath();x.arc(X(px),Y(py),6,0,7);x.fill();if(t){x.fillStyle='#fff';x.font='bold 9px system-ui';x.textAlign='center';x.fillText(t,X(px),Y(py)-8);}};
 for(const lx of [-2.6,-1.3,0,1.3,2.6])dot(lx,-.6,'#c9d1db');
 for(const [r,,,lx,lz] of F){const px=lx==='L'?-20:lx==='R'?20:lx;pos[r]=[px,lz];dot(px,lz,r==='QB'?'#ffd34d':'#ffffff',r);}
 const line=(pts,c,dash)=>{x.strokeStyle=c;x.lineWidth=2.4;x.setLineDash(dash?[5,4]:[]);x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke();x.setLineDash([]);const a=pts[pts.length-1],b=pts[pts.length-2]||a,an=Math.atan2(-(a[1]-b[1]),a[0]-b[0]);x.fillStyle=c;x.beginPath();x.moveTo(X(a[0]),Y(a[1]));x.lineTo(X(a[0])-8*Math.cos(an-.4),Y(a[1])-8*Math.sin(an-.4));x.lineTo(X(a[0])-8*Math.cos(an+.4),Y(a[1])-8*Math.sin(an+.4));x.fill();};
 if(P.type==='pass'){for(const r in P.routes){const p0=pos[r],R_=G.ROUTES[P.routes[r]];if(!p0||!R_)continue;const sg=p0[0]>0?-1:1;line([p0].concat(R_.map(([iw,dp])=>[p0[0]+iw*sg,Math.min(dp,22)])),'#ffd34d');}if(P.pa&&pos.RB)line([pos.RB,[pos.RB[0]+1,pos.RB[1]+3]],'#ff9f43',true);}
 else{const rb=pos.RB||pos.FB,q=pos.QB;if(P.opt==='qb')line([q,[(P.hole||[0])[0],3]],'#ff9f43');else if(P.opt==='read'){line([rb,[P.hole[0],3]],'#ff9f43');line([q,[q[0]+P.side*8,2]],'#ffd34d',true);}
  else if(P.opt==='speed'||P.opt==='triple'){if(P.opt==='triple'&&pos.FB)line([pos.FB,[-P.side*1.2,2]],'#ff9f43');line([q,[q[0]+P.side*8,1]],'#ffd34d');if(rb)line([pos.RB||rb,[q[0]+P.side*12,-1]],'#ff9f43',true);}
  else if(rb)line([rb,[P.hole[0],3]],'#ff9f43',!!P.toss);}}

const DCN={QB:'Quarterback',RB:'Running back',WR:'Wide receiver',TE:'Tight end',OL:'Offensive line',DL:'Defensive line',LB:'Linebacker',CB:'Cornerback',S:'Safety',K:'Kicker',P:'Punter',KR:'Kick returner',PR:'Punt returner'},DCS={QB:1,RB:1,WR:3,TE:1,OL:5,DL:4,LB:3,CB:2,S:2,K:1,P:1,KR:2,PR:1};

 <p class="dim">${DCN[k]}: the top ${st} start${k==='KR'?' (two deep on kickoffs)':''}. Use the arrows to reorder, or add anyone from the roster to this spot.</p>
 ${list.map((p,i)=>`<div class="row dcrow${i<st?' st':''}"><span style="min-width:2.2em"><b>${i+1}</b></span><span class="grow">#${p.num} ${esc(p.n)} <small class="dim">${p.pos} · ${p.ovr} OVR</small></span><button class="chip" data-a="dcmv" data-v="${p.id}" data-k="-1" ${i?'':'disabled'}>▲</button><button class="chip" data-a="dcmv" data-v="${p.id}" data-k="1" ${i<list.length-1?'':'disabled'}>▼</button>${p.pos!==k?`<button class="chip" data-a="dcrm" data-v="${p.id}">Remove</button>`:''}</div>`).join('')||'<p class="dim">Nobody listed. The best receiver returns kicks unless you add someone.</p>'}
 <label>Add to ${k}</label><select data-c="dcadd"><option value="">Choose a player…</option>${t.roster.filter(p=>!list.includes(p)).sort((a,b)=>b.ovr-a.ovr).map(p=>`<option value="${p.id}">${p.pos} #${p.num} ${esc(p.n)} (${p.ovr})</option>`).join('')}</select>
 <div class="row"><button class="chip" data-a="dcauto">Reset ${k} to best available</button></div></div>`;}
function rosterTable(t,fr){const d=E.depth(t);let h=`<div class="card"><div class="row"><button class="chip" data-a="autodepth">Auto-sort depth chart</button><button class="chip" data-a="addplayer">+ Add player</button>${fr?'':'<button class="chip" data-a="xros">⬇ Roster (Excel)</button><button class="chip" data-a="iros">⬆ Roster (Excel or CSV)</button>'}</div><p class="dim">${t.roster.length} players · tap a player to edit name, number, ratings, body and equipment. The top players at each position start.</p><table class="tb ros"><tr><th>Pos</th><th>#</th><th class="l">Name</th><th>${t.roster[0]&&t.roster[0].yr?'Yr':'Age'}</th><th>OVR</th><th>POT</th><th></th></tr>`;
 for(const pos of E.POS)d[pos].forEach((p,i)=>{h+=`<tr class="${i<E.STARTERS[pos]?'st':''}" data-a="pl" data-v="${p.id}"><td>${pos}${i<E.STARTERS[pos]?'':'<small>'+(i+1)+'</small>'}</td><td>${p.num}</td><td class="l">${esc(p.n)}</td><td>${p.yr?yrN[p.yr]:p.age}</td><td><b>${p.ovr}</b></td><td>${p.pot}</td><td>${i>0?`<button class="mini" data-a="depthup" data-v="${p.id}">▲</button>`:''}</td></tr>`;});
 return h+'</table></div>';}
TAB.roster=()=>{const tid=view.rt==null?L.userTid:view.rt,t=L.teams[tid];return `<div class="card"><label>Team</label><select data-c="rt">${teamOpts(L.teams,tid,t=>t.id,L.confs)}</select>${L.mode==='pro'?`<p class="dim">Payroll $${E.payroll(t)}M of $${L.cap}M cap</p>`:''}</div>`+rosterTable(t,true)+depthCard(t);};

 return h+'</table></div>';}
function frontOffice(){const u=L.teams[L.userTid];let h=`<div class="card"><div class="row">${chips('off',view.off,[['trade','Trades'],['fa','Free agents']])}</div><p class="dim">Payroll $${E.payroll(u)}M of $${L.cap}M · Roster ${u.roster.length}/55</p></div>`;
 if(view.off==='fa'){h+=`<div class="card"><table class="tb"><tr><th>Pos</th><th class="l">Name</th><th>Age</th><th>OVR</th><th>$M</th><th></th></tr>${L.fa.slice(0,60).map((p,i)=>`<tr><td>${p.pos}</td><td class="l">${esc(p.n)}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${p.c.sal}</td><td><button class="mini" data-a="signfa" data-v="${i}">Sign</button></td></tr>`).join('')}</table></div>`;return h;}

function offseason(){const O=L.off,u=L.teams[L.userTid],pro=L.mode==='pro';let h=`<div class="card"><div class="tag">OFFSEASON · STEP ${O.step+1} OF ${pro?3:2}</div>`;
