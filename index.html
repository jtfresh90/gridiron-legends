  const confWeek=pro||w>=3,order=shuffle(T.map(t=>t.id)),used={},games=[];

   for(const b of order){if(b===a||used[b])continue;const m=met[key(a,b)]||0,sc=T[a].conf===T[b].conf&&!(L.confs[T[a].conf]||{}).ind,sd=sc&&T[a].div===T[b].div;let s=-m*100+R()*10;

function applyResult(L,g,res){try{foGame(L,Object.assign({},g,{hs:res.hs,as:res.as}));}catch(e){}

/* ---------- awards / leaders ---------- */
function allPlayers(L){const o=[];for(const t of L.teams)for(const p of t.roster)o.push({p,t});return o;}
function leaders(L,key,n){return allPlayers(L).filter(x=>x.p.s[key]).sort((a,b)=>b.p.s[key]-a.p.s[key]).slice(0,n||10);}
function awardRace(L,n){return allPlayers(L).map(x=>{const s=x.p.s;const off=(s.py||0)/28+(s.ptd||0)*3.5-(s.pi||0)*2.5+(s.ry||0)/11+(s.rtd||0)*5+(s.recy||0)/12+(s.rectd||0)*5;return{p:x.p,t:x.t,v:off+x.t.w*1.5,d:(s.tk||0)*.7+(s.sk||0)*4+(s.int||0)*6+x.t.w};}).sort((a,b)=>b.v-a.v).slice(0,n||5);}
function seasonLine(p){const s=p.s;if(s.pa)return `${s.py||0} pass yds, ${s.ptd||0} TD, ${s.pi||0} INT`;if((s.ry||0)>=(s.recy||0)&&s.ra)return `${s.ry||0} rush yds, ${s.rtd||0} TD`;if(s.rec)return `${s.rec} rec, ${s.recy||0} yds, ${s.rectd||0} TD`;return `${s.tk||0} tkl, ${s.sk||0} sacks, ${s.int||0} INT`;}
function awards(L){const r=awardRace(L,1)[0];const dl=allPlayers(L).filter(x=>['DL','LB','CB','S'].includes(x.p.pos)).sort((a,b)=>((b.p.s.tk||0)*.7+(b.p.s.sk||0)*4+(b.p.s.int||0)*6)-((a.p.s.tk||0)*.7+(a.p.s.sk||0)*4+(a.p.s.int||0)*6))[0];
 const f=x=>x?{n:x.p.n,pos:x.p.pos,team:x.t.name,line:seasonLine(x.p)}:null;L.awards={name:L.mode==='college'?'Stiff-Arm Trophy':'League MVP',mvp:f(r),dpoy:f(dl)};}

/* ---------- recruiting (college) ---------- */
function newRecruits(L){const n=Math.max(60,L.teams.length*3);L.recruits=[];L.commits={};const u=L.teams[L.userTid];
 for(let i=0;i<n;i++){const r=R();const stars=r<.04?5:r<.16?4:r<.45?3:r<.8?2:1;const p=mkPlayer(wpick(POS,[4,6,9,4,12,10,8,7,5,1,1]),46+stars*6+ri(0,5),'college',{yr:1});p.pot=clamp(p.ovr+ri(6,20),p.ovr,99);
  const lead=wpick(L.teams.map(t=>t.id),L.teams.map(t=>Math.pow(t.prestige/50,3+stars)));
  L.recruits.push({p,stars,int:clamp(Math.round(R()*25+(u.prestige-50)*.5-stars*5),0,60),lead,lp:ri(15,45),al:0,off:0,com:-1});}
 for(const r of L.recruits)rPrep(L,r);L.rEarly=0;L.scp=60;L.recruits.sort((a,b)=>b.stars-a.stars||b.p.ovr-a.p.ovr);L.rpts=recruitBudget(L);}
function recruitBudget(L){const F=L.fo,b=60+Math.round(L.teams[L.userTid].prestige/2);if(!F)return b;return Math.round(b*(1+(F.alloc.rec-35)/120+(F.alloc.nil-20)/200+(F.fac.rec-2)*.06+stTier(F,'rc')*.05)*(F.probation?.75:1));}
function userClass(L){return L.recruits.filter(r=>r.com===L.userTid).length;}
function recruitTick(L){const u=L.teams[L.userTid];if(!L.recruits)return;
 for(const r of L.recruits){if(r.com>=0)continue;if(r.al>0)r.int+=r.al*(.9+u.prestige/200)*(1.15-r.stars*.11)*(.7+rFitAll(L,r)*.7)+R()*2;else r.int=Math.max(0,r.int-1);r.lp+=ri(2,8);
  if(r.int>=100&&r.int>=r.lp&&r.off&&userClass(L)<16){r.com=u.id;r.al=0;L.wire.push(`${r.stars}-star ${r.p.pos} ${r.p.n} commits to ${u.name}.`);}
  else if(r.lp>=100){r.com=r.lead;r.al=0;if(r.stars>=4)L.wire.push(`${r.stars}-star ${r.p.pos} ${r.p.n} picks ${L.teams[r.lead].name}.`);}}}
function signingDay(L){const u=L.teams[L.userTid],O=L.off;L.commits={};
 for(const r of L.recruits){if(r.com<0){if(r.off&&r.int>r.lp&&r.int>=55&&userClass(L)<16)r.com=u.id;else r.com=r.lead;}(L.commits[r.com]||(L.commits[r.com]=[])).push(r.p);if(r.com===u.id)O.signed.push({n:r.p.n,pos:r.p.pos,stars:r.stars,ovr:r.p.ovr});}
 L.recruits=[];}

/* ---------- offseason ---------- */
function develop(p,mode){let d;if(mode==='college'||p.age<=24)d=clamp(Math.round((p.pot-p.ovr)*.28+gauss()*1.4+.6),-1,7);else if(p.age<=29)d=Math.round(gauss()*1.1);else d=-ri(0,p.pos==='QB'||p.pos==='K'||p.pos==='P'?2:3);
 if(!d)return;for(const a in KEY[p.pos])p.a[a]=clamp(p.a[a]+d,20,99);p.ovr=computeOvr(p);if(p.pot<p.ovr)p.pot=p.ovr;}
function startOffseason(L){try{foSeasonEnd(L);}catch(e){}L.phase='off';const O=L.off={step:0,expiring:[],signed:[],left:[],portal:[],portalUsed:0,grads:[]},u=L.userTid;
 for(const t of L.teams){const keep=[];
  if(L.mode==='college'){const g=t.w+t.l;t.prestige=clamp(Math.round(t.prestige*.86+(38+(g?t.w/g:.5)*58)*.14+(L.champ===t.id?3:0)),30,99);}
  for(const p of t.roster){p.s={};
   if(L.mode==='college'){if(p.yr>=4||(p.yr===3&&p.ovr>=86&&R()<.5)){if(t.id===u)O.left.push(`${p.n} (${p.pos}, ${p.ovr}) — ${p.yr>=4?'graduated':'declared for the pros'}`);O.grads.push(Object.assign(JSON.parse(JSON.stringify(p)),{school:t.name}));continue;}develop(p,'college');if(!p.rsh)p.yr++;p.rsh=0;p.age++;keep.push(p);}
   else{develop(p,'pro');p.age++;if((p.age>=34&&R()<(p.age-32)*.18)||p.age>=41){if(t.id===u)O.left.push(`${p.n} (${p.pos}, ${p.ovr}) — retired`);continue;}
    p.c.y--;if(p.c.y<=0){if(t.id===u){O.expiring.push(p.id);keep.push(p);}else if(R()<.65){p.c={y:ri(1,4),sal:salary(p)};keep.push(p);}else{p.ft=t.id;L.fa.push(p);}}else keep.push(p);}}
  t.roster=keep;delete t._ovr;}
 if(L.mode==='college'){signingDay(L);for(let i=0;i<30;i++){const p=mkPlayer(pick(POS),clamp(66+gauss()*6,55,86),'college',{yr:ri(2,3)});O.portal.push(p);}O.portal.sort((a,b)=>b.ovr-a.ovr);}
 else{for(const p of L.fa){p.s={};}L.fa.sort((a,b)=>b.ovr-a.ovr);L.fa.length=Math.min(L.fa.length,160);mkDraft(L);}
 try{for(const t of L.teams)for(const p of t.roster){p.inj=0;p.injG=0;delete p.injT;p.xp=0;}carousel(L);}catch(e){console.error(e);}}
function resign(L,pid,yes){const t=L.teams[L.userTid],i=t.roster.findIndex(p=>p.id===pid);if(i<0)return;const p=t.roster[i];L.off.expiring=L.off.expiring.filter(x=>x!==pid);
 if(yes){p.c={y:ri(2,4),sal:Math.round(salary(p)*1.1*10)/10};}else{t.roster.splice(i,1);p.c={y:1,sal:salary(p)};p.ft=t.id;L.fa.push(p);L.fa.sort((a,b)=>b.ovr-a.ovr);}}

/* ===================== Program (dynasty) and Front Office (franchise) =====================
   College: Dynasty Points each year from the athletic director, split between recruiting, training, discipline and NIL
   (recruiting NIL and roster NIL); facility tiers F..A+; coordinators and support staff Bronze..Platinum; AD goals and job
   security; discipline incidents (suspend or risk probation); redshirts; a trophy room.
   Pro: owner's box (ticket, food, merch and parking prices -> attendance, fan support, revenue), contract talks with a
   patience meter, the franchise tag, captains, player personas and morale, coordinators and staff.
   Both: wear and tear on every player, and a news feed. Everything feeds the game: a team boost in simulated games,
   recruiting budget, development in the offseason and how many players leave. */
const FAC_T=['F','D','C','B','A','A+'],TIER=['Bronze','Silver','Gold','Platinum'],PERS=['Team first','Competitor','Money focused','Spotlight','Mentor','Hothead','Quiet pro','Loyal'],
 ADS=[['Old school','wins'],['Brand builder','exposure'],['Academic','discipline'],['Win now','titles']],
 STAFF_ROLES=[['oc','Offensive coordinator'],['dc','Defensive coordinator'],['st','Strength & conditioning'],['rc','Recruiting director'],['tr','Head athletic trainer'],['an','Analytics / video']],
 INC=[['skipped class',1],['missed curfew',1],['fight at a party',3],['academic issue',2],['team rules violation',2],['social media post',1],['traffic stop',2]];
function foMk(L){const col=L.mode==='college',t=L.teams[L.userTid];const fo={v:1,dp:0,alloc:{rec:35,train:30,disc:15,nil:20},nilR:50,fac:{train:2,stad:2,rec:2,med:2},
  staff:STAFF_ROLES.map(([k,n])=>({k,n,name:pick(['Mike','Dan','Rob','Steve','Tony','Greg','Chris','Lou','Ray','Pat'])+' '+pick(['Hayes','Cole','Barrett','Shaw','Meyer','Price','Doyle','Hart','Lang','Pruitt']),tier:ri(0,1),yrs:ri(1,3)})),
  ad:pick(ADS),goals:[],sec:72,probation:0,incidents:[],news:[],trophies:[],captains:[],tagUsed:0,prices:{tix:95,food:12,merch:60,park:40},fin:{bal:25,season:0,att:.92,support:65,last:null},talks:{}};
 for(const p of t.roster){p.mo=p.mo==null?70:p.mo;p.per=p.per||pick(PERS);p.wr=p.wr||0;}L.fo=fo;foGoals(L);fo.dp=foPayout(L);return fo;}
function fo(L){return L.fo||foMk(L);}
function foNews(L,txt){const F=fo(L);F.news.unshift({y:L.year,w:L.week,txt});if(F.news.length>40)F.news.length=40;}
function foGoals(L){const F=L.fo,t=L.teams[L.userTid],col=L.mode==='college',pr=col?t.prestige:Math.round(teamOvr(t));const g=[];
 g.push({k:'wins',txt:'Win '+Math.max(5,Math.min(col?11:13,Math.round(pr/10)+(col?0:2)))+' games',n:Math.max(5,Math.min(col?11:13,Math.round(pr/10)+(col?0:2)))});
 if(F.ad[1]==='titles')g.push({k:'conf',txt:'Win the conference',n:1});else g.push({k:'post',txt:col?'Reach a bowl game':'Make the playoffs',n:1});
 if(F.ad[1]==='discipline')g.push({k:'clean',txt:'No more than 1 discipline incident ignored',n:1});if(F.ad[1]==='exposure')g.push({k:'home',txt:'Win 5 home games',n:5});F.goals=g;}
function foPayout(L){const t=L.teams[L.userTid],col=L.mode==='college',F=L.fo;return Math.round((col?t.prestige:teamOvr(t))*1.6+(t.w||0)*6+(F.sec-50)*.6+60);}
function facAvg(F){const f=F.fac;return (f.train+f.stad+f.rec+f.med)/4;}
function stTier(F,k){const s=F.staff.find(x=>x.k===k);return s?s.tier:0;}
/* strength modifier for the user team in simulated games (in the sim's 'form' units, roughly +-3) */
function foBoost(L,t){if(!L.fo||t.id!==L.userTid)return 0;const F=L.fo,st=depth(t),starters=[...st.QB.slice(0,1),...st.RB.slice(0,1),...st.WR.slice(0,3),...st.OL.slice(0,5),...st.DL.slice(0,4),...st.LB.slice(0,3),...st.CB.slice(0,2),...st.S.slice(0,2)].filter(Boolean);
 const wr=starters.reduce((s,p)=>s+(p.wr||0),0)/(starters.length||1),mo=t.roster.reduce((s,p)=>s+(p.mo==null?70:p.mo),0)/(t.roster.length||1);
 return (facAvg(F)-2)*.35+(stTier(F,'oc')+stTier(F,'dc'))*.25+(mo-65)*.035-wr*.035-(F.probation?.4:0)+F.captains.length*.08;}
function foGame(L,g){if(!L.fo)return;const u=L.userTid;if(g.h!==u&&g.a!==u)return;const F=L.fo,t=L.teams[u],won=(g.h===u)===(g.hs>g.as)&&g.hs!==g.as,home=g.h===u;
 const st=depth(t),start=new Set([...st.QB.slice(0,1),...st.RB.slice(0,2),...st.WR.slice(0,3),...st.TE.slice(0,1),...st.OL.slice(0,5),...st.DL.slice(0,4),...st.LB.slice(0,3),...st.CB.slice(0,3),...st.S.slice(0,2)].filter(Boolean).map(p=>p.id));
 for(const p of t.roster){if(start.has(p.id)){p.wr=Math.min(100,(p.wr||0)+ri(5,13)-stTier(F,'st')-F.fac.med);p.gp=(p.gp||0)+1;}const pt=start.has(p.id)?1:-1;let d=won?2:-2;if(p.per==='Competitor')d+=pt*2;if(p.per==='Spotlight'&&!start.has(p.id))d-=2;if(p.per==='Loyal'||p.per==='Quiet pro')d=Math.max(d,0);if(F.captains.includes(p.id))d+=1;p.mo=clamp((p.mo==null?70:p.mo)+d,10,99);
  if(p.mo<30&&R()<.15&&!p.unhappy){p.unhappy=1;foNews(L,`${p.n} (${p.pos}) is unhappy with his role${L.mode==='pro'?' and has asked about a trade':' and is weighing the transfer portal'}.`);}}
 if(L.mode==='pro'&&home){const P=F.prices,base=.62+F.fin.support/250-(P.tix-95)*.0035-(P.park-40)*.002+(t.w||0)*.012,att=clamp(base,.35,1),cap=70000,rev=(att*cap*(P.tix+P.food*.9*(1.15-P.food/40)+P.merch*.18*(1.2-P.merch/150)+P.park*.35))/1e6;F.fin.att=att;F.fin.season=Math.round((F.fin.season+rev)*10)/10;F.fin.support=clamp(F.fin.support+(won?1.5:-1.5)-(P.tix>130?1:0),5,99);F.fin.last={att:Math.round(att*cap),rev:Math.round(rev*10)/10};}
 if(home&&won)F.homeW=(F.homeW||0)+1;}
function foWeek(L){if(!L.fo)return;const F=L.fo,t=L.teams[L.userTid];for(const p of t.roster)p.wr=Math.max(0,(p.wr||0)-(6+F.fac.med*1.5+stTier(F,'tr')*1.5));
 for(const p of t.roster)if(p.susp>0)p.susp--;
 if(L.phase==='regular'&&R()<(L.mode==='college'?.16:.06)-(F.alloc.disc-15)*.002){const p=pick(t.roster),w=pick(INC);F.incidents.push({id:Date.now()%1e9+ri(0,999),pid:p.id,n:p.n,pos:p.pos,what:w[0],sev:w[1],wk:L.week});foNews(L,`${p.n} (${p.pos}): ${w[0]}. Decide on discipline in the Program tab.`);}
 /* incidents left alone for 3 weeks count as ignored */
 F.incidents=F.incidents.filter(i=>{if(L.week-i.wk>=3){foDecide(L,i.id,'ignore',true);return false;}return true;});}
function foDecide(L,id,act,auto){const F=fo(L),i=F.incidents.find(x=>x.id===id);if(!i)return;F.incidents=F.incidents.filter(x=>x!==i);const t=L.teams[L.userTid],p=t.roster.find(x=>x.id===i.pid);
 if(act==='suspend'){const cost=i.sev*6;F.dp=Math.max(0,F.dp-Math.max(0,cost-F.alloc.disc*.2));if(p){p.susp=i.sev;p.mo=clamp((p.mo||70)-4,10,99);}foNews(L,`${i.n} suspended ${i.sev} game${i.sev>1?'s':''} for ${i.what}.`);}
 else{F.ignored=(F.ignored||0)+1;if(R()<i.sev*.12+(F.ignored>2?.15:0)){F.probation=Math.max(F.probation,L.mode==='college'?2:1);F.sec=clamp(F.sec-8,0,100);foNews(L,L.mode==='college'?`NCAA places the program on probation over ${i.what}: scholarships cut and recruiting limited for ${F.probation} years.`:`The league fines the team over ${i.what}.`);if(L.mode==='pro')F.fin.bal-=1.5;}else foNews(L,`${i.n}: ${i.what} handled internally${auto?' (no decision made)':''}.`);}}
function foSeasonEnd(L){if(!L.fo)return;const F=L.fo,t=L.teams[L.userTid],col=L.mode==='college',res=[];
 for(const g of F.goals){let ok=false;if(g.k==='wins')ok=(t.w||0)>=g.n;else if(g.k==='post')ok=L.schedule.slice(L.regWeeks).some(w=>w.some(x=>x.h===t.id||x.a===t.id));else if(g.k==='conf')ok=L.schedule.slice(L.regWeeks).some(w=>w.some(x=>x.played&&x.lab&&/Championship/.test(x.lab)&&!/National|Bowl/.test(x.lab)&&winner(x)===t.id));else if(g.k==='clean')ok=(F.ignored||0)<=1;else if(g.k==='home')ok=(F.homeW||0)>=g.n;res.push([g.txt,ok]);}
 const met=res.filter(r=>r[1]).length;F.sec=clamp(F.sec+(met*10-12)+(L.champ===t.id?20:0),0,100);F.history=F.history||[];F.history.unshift({y:L.year,w:t.w,l:t.l,goals:res,sec:F.sec});
 foNews(L,`Season review: ${met} of ${res.length} ${col?'athletic director':'owner'} goals met. Job security ${F.sec}%.${F.sec<25?' You are on the hot seat.':''}`);
 /* trophies */
 if(L.champ===t.id)F.trophies.push({y:L.year,txt:col?'National Champions':'League Champions'});
 for(const w of L.schedule.slice(L.regWeeks))for(const x of w)if(x.played&&winner(x)===t.id&&x.lab&&(x.bowl||/Championship/.test(x.lab)))F.trophies.push({y:L.year,txt:x.lab});
 const aw=awardRace?awardRace(L):null;if(aw&&aw[0]&&aw[0].t===t.id)F.trophies.push({y:L.year,txt:(col?'Heisman-style award':'MVP')+': '+aw[0].p.n});
 /* development from training budget, facilities and staff */
 const bonus=(F.alloc.train-25)*.05+(F.fac.train-2)*.5+stTier(F,'st')*.4+stTier(F,'oc')*.2+stTier(F,'dc')*.2;for(const p of t.roster){if(R()<.7){const ks=Object.keys(p.a);for(let i=0;i<3;i++){const k=pick(ks);p.a[k]=clamp(p.a[k]+Math.round(bonus+gauss()),20,99);}p.ovr=computeOvr(p);}p.wr=0;}
 if(F.probation)F.probation--;if(L.mode==='pro'){F.fin.bal=Math.round((F.fin.bal+F.fin.season-payroll(t)*.12-6)*10)/10;F.fin.season=0;}F.tagUsed=0;F.homeW=0;F.ignored=0;for(const s of F.staff){s.yrs--;if(s.yrs<=0){s.yrs=ri(1,3);if(R()<.4&&s.tier>1){foNews(L,`${s.name} (${s.n}) left for a head coaching job.`);s.tier=Math.max(0,s.tier-1);s.name=pick(['Mike','Dan','Rob','Steve','Tony'])+' '+pick(['Ward','Kerr','Bell','Moss','Vance']);}}}}
function foNewSeason(L){if(!L.fo)return;const F=L.fo;foGoals(L);F.dp+=foPayout(L);foNews(L,`New season: ${F.dp} ${L.mode==='college'?'Dynasty Points':'budget points'} to spend. Goals: ${F.goals.map(g=>g.txt).join(' · ')}.`);for(const p of L.teams[L.userTid].roster){p.mo=p.mo==null?70:Math.round(p.mo*.6+70*.4);p.per=p.per||pick(PERS);p.unhappy=0;}}
function foSpend(L,kind,k){const F=fo(L);if(kind==='fac'){const cost=[0,60,90,130,180,240][Math.min(5,F.fac[k]+1)]||999;if(F.fac[k]>=5||F.dp<cost)return 'Not enough points.';F.dp-=cost;F.fac[k]++;foNews(L,`Facility upgrade: ${k} now grade ${FAC_T[F.fac[k]]}.`);return '';}
 if(kind==='staff'){const s=F.staff.find(x=>x.k===k);const cost=[50,90,140][s.tier]||999;if(s.tier>=3||F.dp<cost)return 'Not enough points.';F.dp-=cost;s.tier++;foNews(L,`${s.n} upgraded to ${TIER[s.tier]}.`);return '';}return '';}
function foAlloc(L,k,v){const F=fo(L),a=F.alloc;a[k]=clamp(v,0,100);const tot=a.rec+a.train+a.disc+a.nil;if(tot>100){const over=tot-100,others=Object.keys(a).filter(x=>x!==k);for(const o of others){const cut=Math.min(a[o],Math.ceil(over/others.length));a[o]-=cut;}}}
/* contract talks: the player asks for more years/money depending on persona; each offer under his ask costs patience */
function foAsk(L,p){const base=salary(p),mult={'Money focused':1.3,'Loyal':.92,'Team first':.95,'Spotlight':1.15}[p.per]||1.05;return {sal:Math.round(base*mult*10)/10,y:p.age>=30?2:ri(3,5)};}
function foOffer(L,pid,y,sal){const F=fo(L),t=L.teams[L.userTid],p=t.roster.find(x=>x.id===pid);if(!p)return {ok:false,msg:'Player not found.'};const T=F.talks[pid]||(F.talks[pid]={pat:100,ask:foAsk(L,p)}),A_=T.ask;
 const score=sal/A_.sal-Math.abs(y-A_.y)*.03;if(score>=.98){p.c={y,sal:Math.round(sal*10)/10};L.off&&(L.off.expiring=L.off.expiring.filter(x=>x!==pid));p.mo=clamp((p.mo||70)+6,10,99);delete F.talks[pid];foNews(L,`${p.n} signs: ${y} years, $${sal}M a year.`);return {ok:true,msg:'Deal done.'};}
 T.pat=Math.max(0,T.pat-Math.round((1-score)*60+8));if(T.pat<=0){resign(L,pid,false);delete F.talks[pid];foNews(L,`Talks broke down; ${p.n} heads to free agency.`);return {ok:false,msg:'He walked away from the table.',gone:true};}
 return {ok:false,msg:`Not enough. Patience ${T.pat}%. He wants about $${A_.sal}M for ${A_.y} years.`};}
function foTag(L,pid){const F=fo(L),t=L.teams[L.userTid],p=t.roster.find(x=>x.id===pid);if(!p||F.tagUsed)return 'The tag has been used this year.';const top=L.teams.flatMap(x=>x.roster).filter(q=>q.pos===p.pos&&q.c).map(q=>q.c.sal).sort((a,b)=>b-a).slice(0,5);const sal=Math.round((top.reduce((a,b)=>a+b,0)/(top.length||1))*10)/10;p.c={y:1,sal};F.tagUsed=1;L.off&&(L.off.expiring=L.off.expiring.filter(x=>x!==pid));p.mo=clamp((p.mo||70)-8,10,99);foNews(L,`Franchise tag on ${p.n}: one year at $${sal}M.`);return '';}
function foCaptain(L,pid){const F=fo(L);if(F.captains.includes(pid))F.captains=F.captains.filter(x=>x!==pid);else if(F.captains.length<3)F.captains.push(pid);}
/* ===================== Career systems =====================
   Injuries (played and simulated games, weekly healing), 4-stage recruiting (scouting, pitch, visits, signing),
   pro scouting and the combine, the coaching carousel, the free-agency frenzy and undrafted free agents,
   position battles, and in-season progression. */
const INJ=[['bruised ribs',1,1,18],['ankle sprain',1,2,20],['hamstring strain',1,3,16],['shoulder injury',1,3,12],['concussion',1,2,10],['knee sprain',2,4,9],['turf toe',2,5,6],['broken hand',3,5,4],['high ankle sprain',3,6,4],['torn ACL',10,20,1]];
function injure(p,minW){const ok=INJ.filter(x=>x[2]>=(minW||1)),it=wpick(ok,ok.map(x=>x[3])),w=ri(Math.max(it[1],minW||1),it[2]);p.inj=w;p.injT=it[0];p.injNew=1;return {t:it[0],w};}
function healWeek(L){for(const t of L.teams)for(const p of t.roster){p.injG=0;if(p.injNew){p.injNew=0;continue;}if(p.inj>0){p.inj--;if(!p.inj){if(t.id===L.userTid)foNews(L,`${p.n} (${p.pos}) is cleared to play after his ${p.injT}.`);delete p.injT;}}}}
function starters(t){const d=depth(t),o=[];for(const k of POS)o.push(...d[k].slice(0,STARTERS[k]));return o.filter(Boolean);}

 if(tid===L.userTid)foNews(L,`${p.n} (${p.pos}) suffered a ${r.t} and will miss ${r.w} week${r.w>1?'s':''}.`);else if(p.ovr>=80&&L.wire)L.wire.push(`${t.name} ${p.pos} ${p.n} is out ${r.w} week${r.w>1?'s':''} with a ${r.t}.`);}}

/* ---------- 4-stage recruiting ---------- */
const RSTAGE=['Scouting','Pitch','Visits','Signing'],PRI=['Playing time','Program prestige','NIL money','Facilities','Close to home','Title contender','Coach stability'];
function rStage(L){if(L.phase!=='regular')return 3;const n=L.regWeeks||12;return L.week>=n?3:L.week<Math.round(n*.25)?0:L.week<Math.round(n*.6)?1:2;}

 r.pri=shuffle(PRI.slice()).slice(0,2);r.prox=ri(0,100);r.vis=-1;r.visited=0;}
function rVis(r){const f=1-Math.min(100,r.sc||0)/100;return {ovr:clamp(Math.round(r.p.ovr+(r.fz||0)*f),30,99),pot:clamp(Math.round(r.p.pot+(r.pfz||0)*f),30,99),known:(r.sc||0)>=100};}
function rFit(L,r,k){const u=L.teams[L.userTid],F=L.fo,g=u.w+u.l;switch(k){case 'Playing time':return clamp(need(u,r.p.pos)/12,0,1);case 'Program prestige':return u.prestige/100;case 'NIL money':return F?clamp(F.alloc.nil/40,0,1):.5;case 'Facilities':return F?facAvg(F)/5:.45;
 case 'Close to home':return r.prox/100;case 'Title contender':return g?u.w/g:clamp((u.prestige-40)/55,0,1);case 'Coach stability':return F?F.sec/100:.6;}return .5;}
function rFitAll(L,r){rPrep(L,r);return (rFit(L,r,r.pri[0])*.6+rFit(L,r,r.pri[1])*.4);}
function scoutRecruit(L,i){const r=L.recruits[i];if(!r)return 'Not found';rPrep(L,r);if(r.sc>=100)return 'Already fully scouted';if((L.scp||0)<10)return 'No scouting points left this week';L.scp-=10;r.sc=Math.min(100,r.sc+(rStage(L)===0?50:34));return '';}
function visitRecruit(L,i){const r=L.recruits[i];if(!r)return 'Not found';rPrep(L,r);if(rStage(L)!==2)return 'Official visits happen in the Visits stage';if(r.visited||r.vis>=0)return 'Visit already used';
 let wk=-1;for(let w=L.week;w<L.regWeeks;w++){const g=(L.schedule[w]||[]).find(x=>x.h===L.userTid&&!x.played);if(g){const n=L.recruits.filter(x=>x.vis===w).length;if(n<4){wk=w;break;}}}if(wk<0)return 'No home game left with an open visit slot (4 per game)';r.vis=wk;return 'Visit set for week '+(wk+1);}
function recruitStageTick(L){const u=L.teams[L.userTid],st=rStage(L);L.scp=40+(L.fo?stTier(L.fo,'rc')*10+(L.fo.fac.rec-2)*5:0)+(st===0?20:0);
 for(const r of L.recruits||[]){rPrep(L,r);if(r.vis===L.week-1){const g=(L.schedule[L.week-1]||[]).find(x=>x.h===L.userTid);if(g&&g.played){const won=g.hs>g.as,b=12+(won?10:-4)+Math.round((u.prestige-60)*.15);r.int+=b;r.visited=1;r.vis=-1;if(r.stars>=4&&r.com<0)L.wire.push(`${r.stars}-star ${r.p.pos} ${r.p.n} ${won?'loved':'left mixed on'} his official visit to ${u.name}.`);}else r.vis=-1;}}
 if(st===3&&!L.rEarly){L.rEarly=1;for(const r of L.recruits||[]){if(r.com>=0)continue;if(r.off&&r.int>=85&&r.int>r.lp&&userClass(L)<16){r.com=u.id;L.wire.push(`Early signing day: ${r.stars}-star ${r.p.pos} ${r.p.n} signs with ${u.name}.`);}else if(r.lp>=85&&R()<.6){r.com=r.lead;}}}}

/* ---------- pro scouting and the combine ---------- */
function prospect(p){p.sc=p.sc||0;if(p.fz==null){p.fz=Math.round(gauss()*7);p.pfz=Math.round(gauss()*10);}return p;}
function pVis(p){const f=1-Math.min(100,p.sc||0)/100;return {ovr:clamp(Math.round(p.ovr+(p.fz||0)*f),30,99),pot:clamp(Math.round(p.pot+(p.pfz||0)*f),30,99),known:(p.sc||0)>=100};}
function genClass(L){const n=L.teams.length,pool=[];if(L.nextClass&&L.nextClass.length){for(const q of L.nextClass.slice(0,n*12))pool.push(toPro(q));L.nextClass=null;}

 for(const p of pool){prospect(p);p.school=p.school||pick(Array.isArray(PLACES)?PLACES:String(PLACES).split(','))+' '+pick(['State','Tech','University','A&M','College']);}pool.sort((a,b)=>(b.ovr+b.pot*.5)-(a.ovr+a.pot*.5));return pool;}
function scoutProspect(L,pid){const p=(L.dclass||(L.draft&&L.draft.pool)||[]).find(x=>x.id===pid);if(!p)return 'Not found';prospect(p);if(p.sc>=100)return 'Already fully scouted';if((L.scp||0)<15)return 'No scouting points left';L.scp-=15;p.sc=Math.min(100,p.sc+34);return '';}

 p.sc=Math.min(100,(p.sc||0)+20);const shine=(a.spd+a.agi+a.str)/3-60+gauss()*3;p.fz=Math.round((p.fz||0)+(shine>8?2:shine<-8?-2:0));}}

/* ---------- coaching carousel ---------- */
const CFN='Bill,Nick,Dabo,Kirk,Pete,Sean,Andy,Mike,Kyle,Matt,Dan,Lane,Brian,Kevin,Steve,Tom,Jim,Mark,Ron,Gary'.split(','),CLN='Harbin,Sabo,Whitley,Ferentz,Carlo,Mcvay,Reidel,Tomlin,Shanley,Campo,Quinlan,Kiffman,Kelso,Stoops,Sarkis,Coughlin,Holtz,Richt,Rivera,Patterson'.split(',');
function mkCoach(r){return {n:pick(CFN)+' '+pick(CLN),age:ri(36,62),r:clamp(Math.round(r!=null?r:62+gauss()*8),45,96),yrs:0,w:0,l:0};}
function coach(L,t){if(!t.hc)t.hc=mkCoach(L.mode==='college'?50+t.prestige*.35+gauss()*6:66+gauss()*7);return t.hc;}
function coachEdge(L,t){if(t.id===L.userTid)return 0;const c=coach(L,t);return (c.r-70)*.05;}
function expect(L,t){if(L.mode==='college')return clamp((t.prestige-35)/60,.15,.85);const i=L.teams.slice().sort((a,b)=>teamOvr(b)-teamOvr(a)).indexOf(t);return clamp(.78-i/L.teams.length*.56,.2,.8);}
function carousel(L){const O=L.off,log=O.carousel=[],vac=[],u=L.userTid,col=L.mode==='college';
 for(const t of L.teams){if(t.id===u)continue;const c=coach(L,t),g=t.w+t.l;c.yrs++;c.w+=t.w;c.l+=t.l;c.age++;const wp=g?t.w/g:.5,ex=expect(L,t);
  if(c.age>=69&&R()<.45){log.push(`${t.name}: ${c.n} retires after ${c.yrs} seasons.`);vac.push(t);}
  else if(c.yrs>=2&&wp<ex-.22&&R()<.75){log.push(`${t.name} fire ${c.n} (${t.w}-${t.l}).`);vac.push(t);}}
 const pool=[];for(let i=0;i<vac.length+8;i++){const c=mkCoach(58+gauss()*7);c.from=pick(['offensive coordinator','defensive coordinator','assistant head coach']);pool.push(c);}
 vac.sort((a,b)=>(col?b.prestige-a.prestige:teamOvr(b)-teamOvr(a)));
 for(let i=0;i<vac.length;i++){const t=vac[i];let hire=null;
  const stars=L.teams.filter(x=>x.id!==u&&x.hc&&!vac.includes(x)&&x.hc.yrs>=2&&(x.hc.w/Math.max(1,x.hc.w+x.hc.l))>.66&&(col?x.prestige<t.prestige-8:R()<.5));
  if(stars.length&&R()<.55){const s=pick(stars);hire=s.hc;log.push(`${t.name} hire ${hire.n} away from ${s.name}.`);s.hc=null;vac.push(s);}
  else{hire=pool.shift()||mkCoach();log.push(`${t.name} hire ${hire.n}, ${hire.from||'a veteran head coach'}.`);}
  hire.yrs=0;hire.w=hire.l=0;t.hc=hire;}
 /* the user: fired on a cold seat, wanted after a big year */
 const me=L.teams[u],F=L.fo,g=me.w+me.l,wp=g?me.w/g:.5,fired=F&&F.sec<=8;O.fired=fired?1:0;
 const open=vac.filter(t=>t.id!==u);let offers=[];
 if(fired)offers=L.teams.filter(t=>t.id!==u&&(col?t.prestige<me.prestige:teamOvr(t)<=teamOvr(me)+2)).sort(()=>R()-.5).slice(0,3);
 else if(wp>=.66||L.champ===u)offers=open.filter(t=>col?t.prestige>me.prestige:true).slice(0,3);
 O.offers=offers.map(t=>t.id);if(fired)log.unshift(`${me.name} have fired you. Pick a new job from the offers below.`);else if(O.offers.length)log.unshift(`${O.offers.length} ${col?'program':'team'}${O.offers.length>1?'s want':' wants'} to interview you.`);}
function takeJob(L,tid){const O=L.off;if(!O||!(O.offers||[]).includes(tid))return 'That job is not on the table';const old=L.teams[L.userTid],t=L.teams[tid];
 old.hc=mkCoach(60+gauss()*6);t.hc=null;L.userTid=tid;O.offers=[];O.fired=0;O.expiring=[];L.fo=null;foMk(L);foNews(L,`You are the new head coach of ${t.name}.`);(O.carousel||[]).unshift(`You leave ${old.name} for ${t.name}.`);return 'Welcome to '+t.name+'!';}

/* ---------- undrafted free agents and the free-agency frenzy ---------- */
function udfaStart(L){const O=L.off,D=L.draft;if(O.udfa)return;const left=(D?D.pool:[]).slice().sort((a,b)=>(b.ovr+b.pot*.4)-(a.ovr+a.pot*.4)).slice(0,45);for(const p of left){p.c={y:2,sal:.8};}O.udfa=left;O.udfaN=0;if(D)D.pool=[];}
function udfaSign(L,pid){const O=L.off,t=L.teams[L.userTid],i=(O.udfa||[]).findIndex(p=>p.id===pid);if(i<0)return 'Not available';if(O.udfaN>=8)return 'You have used all 8 undrafted signings';if(t.roster.length>=55)return 'Roster is full (55)';
 const p=O.udfa[i],ch=clamp(.45+need(t,p.pos)*.035+(L.fo?(L.fo.fin.support-60)*.004:0),.3,.95);O.udfaN++;O.udfa.splice(i,1);if(R()<ch){t.roster.push(p);fixNums(t);return p.n+' signs as an undrafted free agent!';}
 const o=pick(L.teams.filter(x=>x.id!==t.id));o.roster.push(p);return p.n+' chose '+o.name+' instead.';}
function udfaCpu(L){const O=L.off;for(const t of L.teams){if(t.id===L.userTid)continue;for(let k=0;k<2&&O.udfa&&O.udfa.length;k++){let bi=0,bv=-1e9;O.udfa.forEach((p,i)=>{const v=p.ovr+p.pot*.3+need(t,p.pos)+R()*3;if(v>bv){bv=v;bi=i;}});t.roster.push(O.udfa.splice(bi,1)[0]);}}O.udfa=[];}
function faAsk(p){const m={'Money focused':1.25,'Loyal':.95,'Team first':.93,'Spotlight':1.12,'Competitor':1.02}[p.per]||1;return Math.max(.8,Math.round(salary(p)*m*10)/10);}
function frenzyStart(L){const O=L.off;if(O.fz)return;for(const p of L.fa){p.per=p.per||pick(PERS);p.ask=faAsk(p);p.ft=p.ft==null?-1:p.ft;}O.fz={day:1,max:5,bids:{},log:[]};}
function frenzyBid(L,pid,sal,y){const O=L.off,F=O.fz,t=L.teams[L.userTid];if(!F||F.day>F.max)return 'The frenzy is over';const p=L.fa.find(x=>x.id===pid);if(!p)return 'Not available';
 const comm=Object.entries(F.bids).filter(([k])=>+k!==pid).reduce((s,[,b])=>s+b.sal,0);if(payroll(t)+comm+sal>L.cap)return 'That offer would put you over the cap';if(t.roster.length+Object.keys(F.bids).length>=55&&!F.bids[pid])return 'Roster is full';F.bids[pid]={sal:Math.round(sal*10)/10,y:clamp(y|0,1,5)};return '';}
function offerScore(L,p,t,sal,y){const ask=p.ask||faAsk(p),g=t.w+t.l,wp=g?t.w/g:.5;let s=sal/ask+(y-2)*.03*(p.age<=29?1:-1);
 if(p.per==='Competitor')s+=(wp-.5)*.5;if(p.per==='Team first')s+=(teamOvr(t)-70)*.01;if(p.per==='Loyal'&&p.ft===t.id)s+=.3;if(p.per==='Spotlight')s+=(t.id%5===0?.12:0);if(p.per==='Money focused')s+=(sal/ask-1)*.5;
 const st=t.roster.filter(x=>x.pos===p.pos).sort((a,b)=>b.ovr-a.ovr)[STARTERS[p.pos]-1];if(!st||st.ovr<p.ovr)s+=.08;return s;}
function frenzyDay(L){const O=L.off,F=O.fz,u=L.teams[L.userTid];if(!F||F.day>F.max)return;const day=F.day;
 const room=t=>L.cap-payroll(t);
 for(const p of L.fa.slice()){const tier=p.ovr>=82?1:p.ovr>=74?2:p.ovr>=66?3:4;if(tier>day+1&&!F.bids[p.id])continue;
  let best=null,bs=-1e9;for(const t of L.teams){if(t.id===L.userTid)continue;if(t.roster.length>=55)continue;const nd=need(t,p.pos);if(nd<3&&p.ovr<78)continue;const sal=Math.round((p.ask||faAsk(p))*(.88+R()*.3)*10)/10;if(room(t)<sal)continue;const y=ri(1,p.age<=28?5:2),s=offerScore(L,p,t,sal,y)+nd*.01;if(s>bs){bs=s;best={t,sal,y};}}
  const ub=F.bids[p.id],us=ub?offerScore(L,p,u,ub.sal,ub.y)+.03:-1e9;const decide=R()<(tier<=day?.75:.35);if(!decide)continue;
  if(ub&&us>=bs&&us>=.93){const i=L.fa.indexOf(p);L.fa.splice(i,1);p.c={y:ub.y,sal:ub.sal};u.roster.push(p);fixNums(u);delete F.bids[p.id];F.log.unshift(`Day ${day}: ${p.pos} ${p.n} (${p.ovr}) signs with YOU — ${ub.y} yr, $${ub.sal}M`);}
  else if(best&&bs>=.9){const i=L.fa.indexOf(p);L.fa.splice(i,1);p.c={y:best.y,sal:best.sal};best.t.roster.push(p);if(ub){delete F.bids[p.id];F.log.unshift(`Day ${day}: ${p.pos} ${p.n} turns you down for ${best.t.name} (${best.y} yr, $${best.sal}M)`);}else if(p.ovr>=72)F.log.unshift(`Day ${day}: ${p.pos} ${p.n} (${p.ovr}) signs with ${best.t.name} — ${best.y} yr, $${best.sal}M`);}}
 F.day++;if(F.day>F.max){for(const id in F.bids)delete F.bids[id];F.log.unshift('The frenzy is over. Remaining free agents can be signed at their asking price.');}}

/* ---------- position battles ---------- */
function battlesStart(L){const t=L.teams[L.userTid],d=depth(t),B=[];for(const pos of POS){const s=STARTERS[pos]-1,a=d[pos][s],b=d[pos][s+1];if(a&&b&&Math.abs(a.ovr-b.ovr)<=3&&!(a.inj>0)&&!(b.inj>0))B.push({pos,a:a.id,b:b.id,sa:50,sb:50,reps:0,done:0});}
 L.battles=B.sort((x,y)=>STARTERS[y.pos]-STARTERS[x.pos]).slice(0,4);}
function battleReps(L,i,who){const b=(L.battles||[])[i];if(!b||b.done)return;b.reps=who;}
function battleResolve(L,b,win,early){const t=L.teams[L.userTid],by=id=>t.roster.find(p=>p.id===id),W=by(win==='a'?b.a:b.b),Lo=by(win==='a'?b.b:b.a);b.done=1;b.win=W?W.id:null;if(!W)return;
 if(!early){W.a.awr=clamp(W.a.awr+2,20,99);W.ovr=computeOvr(W);}if(Lo&&Lo.mo!=null)Lo.mo=clamp(Lo.mo-8,0,100);
 const d=depth(t);t.dc=t.dc||{};const cur=d[b.pos].map(p=>p.id).filter(id=>id!==W.id&&id!==(Lo&&Lo.id)),s=STARTERS[b.pos]-1,arr=cur.slice(0,s).concat([W.id],Lo?[Lo.id]:[],cur.slice(s));t.dc[b.pos]=arr;
 foNews(L,`Position battle settled: ${W.n} wins the ${b.pos} job${Lo?' over '+Lo.n:''}.`);}
function battleWeek(L){const t=L.teams[L.userTid];for(const b of L.battles||[]){if(b.done)continue;const A=t.roster.find(p=>p.id===b.a),B=t.roster.find(p=>p.id===b.b);if(!A||!B){b.done=1;continue;}
 b.sa+=A.ovr*.12+gauss()*4+(b.reps==='a'?6:b.reps==='b'?-2:0)+Math.min(6,(A.wxpLast||0)*2);b.sb+=B.ovr*.12+gauss()*4+(b.reps==='b'?6:b.reps==='a'?-2:0)+Math.min(6,(B.wxpLast||0)*2);
 if(L.week>=3)battleResolve(L,b,b.sa>=b.sb?'a':'b');}}

/* ---------- in-season progression ---------- */
function progWeek(L){const u=L.userTid,F=L.fo,col=L.mode==='college',rep=[];for(const t of L.teams){const tb=t.id===u&&F?(F.alloc.train-25)*.012+(F.fac.train-2)*.08+stTier(F,'st')*.06:0;
 for(const p of t.roster){const young=col||p.age<=24,base=young?Math.max(0,p.pot-p.ovr)*.055:p.age>=31?-.22-(p.age-31)*.05:.05;const w=p.wxp||0;p.wxpLast=w;p.xp=(p.xp||0)+base+w+tb+gauss()*.35;p.wxp=0;
  if(p.xp>=4||p.xp<=-4){const up=p.xp>0,ks=Object.keys(KEY[p.pos]),k=pick(ks),o0=p.ovr;p.a[k]=clamp(p.a[k]+(up?ri(1,2):-1),20,99);p.ovr=computeOvr(p);if(up&&p.pot<p.ovr)p.pot=p.ovr;p.xp+=up?-4:4;if(t.id===u&&p.ovr!==o0)rep.push({n:p.n,pos:p.pos,a:ATTRN[k]||k,o0,o1:p.ovr});}}}
 if(rep.length){L.prog=rep.concat(L.prog||[]).slice(0,40);const ups=rep.filter(r=>r.o1>r.o0);if(ups.length)foNews(L,`Progression: ${ups.slice(0,4).map(r=>`${r.n} ${r.o0}→${r.o1}`).join(', ')}${ups.length>4?` and ${ups.length-4} more`:''}.`);}}

function payroll(t){return Math.round(t.roster.reduce((s,p)=>s+(p.c?p.c.sal:0),0)*10)/10;}
function mkDraft(L){const n=L.teams.length,pool=L.dclass&&L.dclass.length?L.dclass:genClass(L);L.dclass=null;combine(L,pool);
 pool.sort((a,b)=>(b.ovr+b.pot*.5)-(a.ovr+a.pot*.5));const ord=L.teams.slice().sort((a,b)=>(a.id===L.champ?1:0)-(b.id===L.champ?1:0)||-stSort(a,b)).map(t=>t.id);const order=[];for(let r=0;r<7;r++)order.push(...ord);
 L.draft={pool,order,i:0,log:[]};}
/* draft classes move between saves: a college class (graduates and early entrants) feeds a pro draft, and a pro draft's
   undrafted players feed the Canadian draft */
function toPro(q){const p=JSON.parse(JSON.stringify(q));p.id=_pid++;p.yr=0;p.age=p.age&&p.age>20?p.age:ri(21,23);p.s={};p.ovr=computeOvr(p);p.pot=Math.max(p.ovr,p.pot||p.ovr);p.c={y:3,sal:Math.max(.8,Math.round(salary(p)*.5*10)/10)};delete p.school;return p;}

function u8b64(u){let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
function b64u8(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function un64(o){if(!o)return null;if(o.t==='blob'){const b=new Blob([b64u8(o.b)],{type:o.mime});try{return new File([b],o.name||'file',{type:o.mime});}catch(e){return b;}}if(o.t==='ab')return b64u8(o.b).buffer;return o.v;}

function drawPlay(x,w,h,D){const P=draftToPlay(D),F=(G.FORMS[P.form]||G.FORMS.gun).slice();if(!G.N12[P.form]&&(D.lv==='f'))F.push(['Y','WR',3,6.5,-2]);const sc=w/56,cx=w/2,ly=h*.8,X=v=>cx+v*sc,Y=v=>ly-v*sc;

 const P=L.prog||[];h+=`<div class="card"><h3>In-season progression</h3><p class="dim">Players improve week to week from game performance, practice and potential; older veterans can slip late in the year.</p>${P.slice(0,16).map(r=>`<div class="li sm"><span class="grow">${r.pos} ${esc(r.n)} · ${esc(r.a)}</span><b class="${r.o1>r.o0?'gold':''}">${r.o0} → ${r.o1}</b></div>`).join('')||'<p class="dim">No rating changes yet this season.</p>'}</div>`;
 if(L.mode!=='pro'||!L.teams[L.userTid].hc){}return h;}

function paint(){for(const c of app.querySelectorAll('canvas[data-paint]')){const k=c.dataset.paint,x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);
  if(k==='play'){if(view.pd)drawPlay(x,c.width,c.height,view.pd);continue;}
  if(k==='kit'){const t=c.dataset.t!=null?EXT[+c.dataset.t]:editTeam();Art.kit(x,t,c.dataset.home==='1',c.width,c.height,null);}
  else if(k==='pkit'){const t=editTeam(),p=findP(t,view.pid);if(p)Art.kit(x,t,true,c.width,c.height,p.num,p);}
  else if(k==='fig'){const t=editTeam(),p=findP(t,view.pid);if(p)Art.figure(x,t,p,c.width,c.height);}
  else if(k==='logo'){const t=editTeam();Art.logo(x,t,c.width/2,c.height/2,c.width/2-6);}
  else if(k==='field'){const big=document.createElement('canvas');big.width=512;big.height=1024;Art.field(big,editTeam(),E.RULES[view.prules||'pro']);x.drawImage(big,0,0,c.width,c.height);}
  else if(k==='cover'){const n=L.news[+c.dataset.i],t=L.teams[+c.dataset.t];let star=null;if(n&&n.cover&&n.cover.star){const s=n.cover.star,st=L.teams[s.tid],p=st&&st.roster.find(p=>p.id===s.pid);star={n:s.n,num:p?p.num:null,p};if(st&&st.id!==t.id)star.num=null;}Art.cover(c,t,star);}}}
