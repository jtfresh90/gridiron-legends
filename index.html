/* League engine: teams, rosters, rules, schedules, quick-sim, playoffs, offseason, news. Pure data, no DOM. */
const E=(()=>{
let R=Math.random;
function seed(s){if(s==null){R=Math.random;return;}let a=s>>>0;R=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v;

    if(!ot&&!(toGo<=1.5&&ytg<60&&R()<.5)){const pp=D[o].P[0];const net=clamp(Math.round(38+((pp?pp.a.kpw:60)-70)*.2+gauss()*7),15,65);const land=ytg-net;
     if(land<=0){if(ru.rouge&&R()<.4){sc[o]+=1;return{n,opp:Lf-35};}return{n,opp:Lf-20};}return{n,opp:Lf-land};}}
   let pp=ru.id==='cfl'?.63:.55;if(toGo>=8&&down>1)pp+=.2;if(toGo<=2)pp-=.25;
   if(R()<pp){
    if(R()<clamp(.065-eP*.0015,.02,.13)){const y=ri(3,9);ytg+=y;toGo+=y;add(sacker(df),'sk',1);add(sacker(df),'tk',1);if(ytg>=Lf){sc[df]+=2;return{n,ko:o,safety:1};}}
    else{add(qb,'pa',1);
     if(R()<clamp(.027-eP*.0007,.008,.06)){add(qb,'pi',1);const c=[...D[df].CB.slice(0,3),...D[df].S.slice(0,2)];if(c.length)add(pick(c),'int',1);
      const dz=Math.max(1,ytg-ri(5,20)),oy=Lf-(dz+ri(0,25));if(oy<=0){sc[df]+=7;return{n,ko:df};}return{n,opp:oy};}
     if(R()<clamp(.64+eP*.005,.42,.82)){let y=Math.round(5+eP*.06-Math.log(1-R()*.999)*8.2);if(y>ytg)y=ytg;const rc=recv(o);add(qb,'pc',1);add(qb,'py',y);add(rc,'rec',1);add(rc,'recy',y);add(tackler(df),'tk',1);

   }else{const rb=rusher(o);let y=Math.round(4.5+eR*.07+gauss()*4+(R()<.045?ri(10,50):0));if(y<-5)y=-5;if(y>ytg)y=ytg;add(rb,'ra',1);add(rb,'ry',y);add(tackler(df),'tk',1);

  return{n,end:1};}
 const koStart=()=>Lf-(ru.id==='cfl'?ri(25,42):ri(22,34)),PH=ru.id==='cfl'?76:66,first=R()<.5?0:1;

function lineFor(p,s){if(!s)return'';
 if(s.pa)return `${s.pc||0}/${s.pa} for ${s.py||0} yds, ${s.ptd||0} TD${s.pi?', '+s.pi+' INT':''}`;
 if(s.ra&&(s.ry||0)>=(s.recy||0))return `${s.ra} carries, ${s.ry||0} yds${s.rtd?', '+s.rtd+' TD':''}`;
 if(s.rec)return `${s.rec} catches, ${s.recy||0} yds${s.rectd?', '+s.rectd+' TD':''}`;
 if(s.fga)return `${s.fgm||0}/${s.fga} field goals`;

function perfScore(s){return (s.py||0)/25+(s.ptd||0)*4-(s.pi||0)*2+(s.ry||0)/10+(s.rtd||0)*6+(s.recy||0)/10+(s.rectd||0)*6+(s.tk||0)*.5+(s.sk||0)*3+(s.int||0)*5+(s.fgm||0)*1.5;}
function applyResult(L,g,res){
 g.played=1;g.hs=res.hs;g.as=res.as;g.ot=res.ot?1:0;const H=L.teams[g.h],A=L.teams[g.a];
 if(!g.po||L.mode==='college'){H.pf+=g.hs;H.pa+=g.as;A.pf+=g.as;A.pa+=g.hs;H.opp.push(A.id);A.opp.push(H.id);
  const sameC=H.conf===A.conf&&!g.po;
  if(g.hs===g.as){H.t++;A.t++;H.strk=A.strk=0;}else{const W=g.hs>g.as?H:A,Lo=W===H?A:H;W.w++;Lo.l++;W.strk=W.strk>0?W.strk+1:1;Lo.strk=Lo.strk<0?Lo.strk-1:-1;if(sameC){W.cw++;Lo.cl++;}}}
 let best=null,bv=-1;
 for(const t of [H,A])for(const p of t.roster){const s=res.st[p.id];if(!s)continue;for(const k in s)p.s[k]=(p.s[k]||0)+s[k];p.s.gp=(p.s.gp||0)+1;const v=perfScore(s)+(((t===H)===(g.hs>g.as))?3:0);if(v>bv){bv=v;best={p,t,s};}}
 g.star=best?{n:best.p.n,pos:best.p.pos,tid:best.t.id,pid:best.p.id,line:lineFor(best.p,best.s),v:Math.round(bv)}:null;}
const winner=g=>g.hs>=g.as?g.h:g.a,loser=g=>g.hs>=g.as?g.a:g.h;
function userGame(L){return (L.schedule[L.week]||[]).find(g=>!g.played&&(g.h===L.userTid||g.a===L.userTid));}
function simRest(L){const wk=L.schedule[L.week]||[];for(const g of wk)if(!g.played)applyResult(L,g,simGame(L,g,{noTie:!!g.po||L.rulesId==='college'}));}

function advance(L){rank(L);if(L.mode==='college')recruitTick(L);L.news.unshift(makeIssue(L));if(L.news.length>8)L.news.length=8;L.wire=[];L.week++;if(L.week>=L.schedule.length)nextStage(L);}
const mkG=(h,a,lab,x)=>Object.assign({h,a,played:0,hs:0,as:0,po:1,lab},x||{});
function roundName(L,m,gi){if(L.mode==='pro')return m>=5?L.confs[gi].name.split(' ')[0]+' Wild Card':m>=3?L.confs[gi].name.split(' ')[0]+' Divisional':L.confs[gi].name+' Championship';

function nextStage(L){

 if(P.stage==='start'){P.stage='ccg';
  if(L.mode==='college'){const games=[];L.confs.forEach((c,ci)=>{const ts=T.filter(t=>t.conf===ci).sort(confSort);if(!ts.length)return;if(ts.length>=8)games.push(mkG(ts[0].id,ts[1].id,c.name+' Championship',{ccg:ci,neutral:1}));else P.champs[ci]=ts[0].id;});

  if(L.mode==='college'){for(const g of L.schedule[L.week-1]||[])if(g.ccg!=null&&g.played)P.champs[g.ccg]=winner(g);rank(L);
   const n=T.length;let k=L.playoff==='bcs'?2:+L.playoff;k=Math.max(2,Math.min(k,2*Math.floor(n/4)));const ch=P.champs.filter(x=>x!=null);let field;

/* ---------- awards / leaders ---------- */
function allPlayers(L){const o=[];for(const t of L.teams)for(const p of t.roster)o.push({p,t});return o;}
function leaders(L,key,n){return allPlayers(L).filter(x=>x.p.s[key]).sort((a,b)=>b.p.s[key]-a.p.s[key]).slice(0,n||10);}
function awardRace(L,n){return allPlayers(L).map(x=>{const s=x.p.s;const off=(s.py||0)/28+(s.ptd||0)*3.5-(s.pi||0)*2.5+(s.ry||0)/11+(s.rtd||0)*5+(s.recy||0)/12+(s.rectd||0)*5;return{p:x.p,t:x.t,v:off+x.t.w*1.5,d:(s.tk||0)*.7+(s.sk||0)*4+(s.int||0)*6+x.t.w};}).sort((a,b)=>b.v-a.v).slice(0,n||5);}
function seasonLine(p){const s=p.s;if(s.pa)return `${s.py||0} pass yds, ${s.ptd||0} TD, ${s.pi||0} INT`;if((s.ry||0)>=(s.recy||0)&&s.ra)return `${s.ry||0} rush yds, ${s.rtd||0} TD`;if(s.rec)return `${s.rec} rec, ${s.recy||0} yds, ${s.rectd||0} TD`;return `${s.tk||0} tkl, ${s.sk||0} sacks, ${s.int||0} INT`;}
function awards(L){const r=awardRace(L,1)[0];const dl=allPlayers(L).filter(x=>['DL','LB','CB','S'].includes(x.p.pos)).sort((a,b)=>((b.p.s.tk||0)*.7+(b.p.s.sk||0)*4+(b.p.s.int||0)*6)-((a.p.s.tk||0)*.7+(a.p.s.sk||0)*4+(a.p.s.int||0)*6))[0];
 const f=x=>x?{n:x.p.n,pos:x.p.pos,team:x.t.name,line:seasonLine(x.p)}:null;L.awards={name:L.mode==='college'?'Stiff-Arm Trophy':'League MVP',mvp:f(r),dpoy:f(dl)};}

/* ---------- recruiting (college) ---------- */
function newRecruits(L){const n=Math.max(60,L.teams.length*3);L.recruits=[];L.commits={};const u=L.teams[L.userTid];
 for(let i=0;i<n;i++){const r=R();const stars=r<.04?5:r<.16?4:r<.45?3:r<.8?2:1;const p=mkPlayer(wpick(POS,[4,6,9,4,12,10,8,7,5,1,1]),46+stars*6+ri(0,5),'college',{yr:1});p.pot=clamp(p.ovr+ri(6,20),p.ovr,99);
  const lead=wpick(L.teams.map(t=>t.id),L.teams.map(t=>Math.pow(t.prestige/50,3+stars)));
  L.recruits.push({p,stars,int:clamp(Math.round(R()*25+(u.prestige-50)*.5-stars*5),0,60),lead,lp:ri(15,45),al:0,off:0,com:-1});}
 L.recruits.sort((a,b)=>b.stars-a.stars||b.p.ovr-a.p.ovr);L.rpts=recruitBudget(L);}
function recruitBudget(L){return 60+Math.round(L.teams[L.userTid].prestige/2);}
function userClass(L){return L.recruits.filter(r=>r.com===L.userTid).length;}
function recruitTick(L){const u=L.teams[L.userTid];if(!L.recruits)return;
 for(const r of L.recruits){if(r.com>=0)continue;if(r.al>0)r.int+=r.al*(.9+u.prestige/200)*(1.15-r.stars*.11)+R()*2;else r.int=Math.max(0,r.int-1);r.lp+=ri(2,8);
  if(r.int>=100&&r.int>=r.lp&&r.off&&userClass(L)<16){r.com=u.id;r.al=0;L.wire.push(`${r.stars}-star ${r.p.pos} ${r.p.n} commits to ${u.name}.`);}
  else if(r.lp>=100){r.com=r.lead;r.al=0;if(r.stars>=4)L.wire.push(`${r.stars}-star ${r.p.pos} ${r.p.n} picks ${L.teams[r.lead].name}.`);}}}
function signingDay(L){const u=L.teams[L.userTid],O=L.off;L.commits={};
 for(const r of L.recruits){if(r.com<0){if(r.off&&r.int>r.lp&&r.int>=55&&userClass(L)<16)r.com=u.id;else r.com=r.lead;}(L.commits[r.com]||(L.commits[r.com]=[])).push(r.p);if(r.com===u.id)O.signed.push({n:r.p.n,pos:r.p.pos,stars:r.stars,ovr:r.p.ovr});}

/* ---------- offseason ---------- */
function develop(p,mode){let d;if(mode==='college'||p.age<=24)d=clamp(Math.round((p.pot-p.ovr)*.28+gauss()*1.4+.6),-1,7);else if(p.age<=29)d=Math.round(gauss()*1.1);else d=-ri(0,p.pos==='QB'||p.pos==='K'||p.pos==='P'?2:3);
 if(!d)return;for(const a in KEY[p.pos])p.a[a]=clamp(p.a[a]+d,20,99);p.ovr=computeOvr(p);if(p.pot<p.ovr)p.pot=p.ovr;}
function startOffseason(L){L.phase='off';const O=L.off={step:0,expiring:[],signed:[],left:[],portal:[],portalUsed:0},u=L.userTid;
 for(const t of L.teams){const keep=[];
  if(L.mode==='college'){const g=t.w+t.l;t.prestige=clamp(Math.round(t.prestige*.86+(38+(g?t.w/g:.5)*58)*.14+(L.champ===t.id?3:0)),30,99);}
  for(const p of t.roster){p.s={};
   if(L.mode==='college'){if(p.yr>=4||(p.yr===3&&p.ovr>=86&&R()<.5)){if(t.id===u)O.left.push(`${p.n} (${p.pos}, ${p.ovr}) — ${p.yr>=4?'graduated':'declared for the pros'}`);continue;}develop(p,'college');p.yr++;p.age++;keep.push(p);}
   else{develop(p,'pro');p.age++;if((p.age>=34&&R()<(p.age-32)*.18)||p.age>=41){if(t.id===u)O.left.push(`${p.n} (${p.pos}, ${p.ovr}) — retired`);continue;}
    p.c.y--;if(p.c.y<=0){if(t.id===u){O.expiring.push(p.id);keep.push(p);}else if(R()<.65){p.c={y:ri(1,4),sal:salary(p)};keep.push(p);}else L.fa.push(p);}else keep.push(p);}}
  t.roster=keep;delete t._ovr;}
 if(L.mode==='college'){signingDay(L);for(let i=0;i<30;i++){const p=mkPlayer(pick(POS),clamp(66+gauss()*6,55,86),'college',{yr:ri(2,3)});O.portal.push(p);}O.portal.sort((a,b)=>b.ovr-a.ovr);}
 else{for(const p of L.fa){p.s={};}L.fa.sort((a,b)=>b.ovr-a.ovr);L.fa.length=Math.min(L.fa.length,160);mkDraft(L);}}
function resign(L,pid,yes){const t=L.teams[L.userTid],i=t.roster.findIndex(p=>p.id===pid);if(i<0)return;const p=t.roster[i];L.off.expiring=L.off.expiring.filter(x=>x!==pid);
 if(yes){p.c={y:ri(2,4),sal:Math.round(salary(p)*1.1*10)/10};}else{t.roster.splice(i,1);p.c={y:1,sal:salary(p)};L.fa.push(p);L.fa.sort((a,b)=>b.ovr-a.ovr);}}
function payroll(t){return Math.round(t.roster.reduce((s,p)=>s+(p.c?p.c.sal:0),0)*10)/10;}
function mkDraft(L){const n=L.teams.length,pool=[];for(let i=0;i<n*7;i++){const tg=clamp(74-i/(n*7)*22+gauss()*4,48,84);const p=mkPlayer(wpick(POS,[4,6,9,4,12,10,8,7,5,1,1]),tg,'pro',{age:ri(21,23)});p.pot=clamp(p.ovr+ri(2,16),p.ovr,99);p.c={y:4,sal:Math.max(.8,Math.round(salary(p)*.5*10)/10)};pool.push(p);}
 pool.sort((a,b)=>(b.ovr+b.pot*.5)-(a.ovr+a.pot*.5));const ord=L.teams.slice().sort((a,b)=>(a.id===L.champ?1:0)-(b.id===L.champ?1:0)||-stSort(a,b)).map(t=>t.id);const order=[];for(let r=0;r<7;r++)order.push(...ord);
 L.draft={pool,order,i:0,log:[]};}
function need(t,pos){const c=t.roster.filter(p=>p.pos===pos);const st=c.sort((a,b)=>b.ovr-a.ovr)[STARTERS[pos]-1];return (c.length<ROSTER[pos]?6:0)+(st?Math.max(0,75-st.ovr)*.3:10);}
function draftCpu(L){const D=L.draft;while(D.i<D.order.length&&D.order[D.i]!==L.userTid&&D.pool.length){const t=L.teams[D.order[D.i]];let bi=0,bv=-1e9;for(let i=0;i<Math.min(25,D.pool.length);i++){const p=D.pool[i],v=p.ovr+p.pot*.5+need(t,p.pos)+R()*4;if(v>bv){bv=v;bi=i;}}draftTake(L,bi);}}
function draftTake(L,idx){const D=L.draft,t=L.teams[D.order[D.i]],p=D.pool.splice(idx,1)[0];t.roster.push(p);const n=L.teams.length;D.log.unshift({r:Math.floor(D.i/n)+1,k:D.i%n+1,tid:t.id,n:p.n,pos:p.pos,ovr:p.ovr});D.i++;}

function frontOffice(){const u=L.teams[L.userTid];let h=`<div class="card"><div class="row">${chips('off',view.off,[['trade','Trades'],['fa','Free agents']])}</div><p class="dim">Payroll $${E.payroll(u)}M of $${L.cap}M · Roster ${u.roster.length}/55</p></div>`;

  else if(k==='pkit'){const t=editTeam(),p=findP(t,view.pid);if(p)Art.kit(x,t,true,c.width,c.height,p.num,p);}

 if(!V.ok&&!V.init(cv)){toast('The 3D engine could not start on this device, so the game was simulated instead.');G.start(Object.assign({},cfg,{user:-1,headless:true}));const r=G.simToEnd();cur=null;return cfg.onEnd(cfg.league?r:null);}
 app.hidden=true;hud.hidden=false;document.body.classList.add('ingame');fin.hidden=true;pm.hidden=true;sheet.hidden=true;mtr.hidden=true;meter=null;audOpen=false;bugKey=uiKey='';{const d=sget('gl_detail');V.setDetail(d==null?2:+d);V.setCam(sget('gl_cam')||'std');pm.querySelector('[data-p=detail]').textContent='Graphics: '+GFX[V.detail];pm.querySelector('[data-p=cam]').textContent='Camera: '+CAMN[V.cam];V.setMocap(sget('gl_mocap')!=='0');pm.querySelector('[data-p=mocap]').textContent='Players: '+(V.mocap?'Motion capture':'Simple');cfg.defCam=sget('gl_dcam')==='def'?'def':'off';pm.querySelector('[data-p=dcam]').textContent='Defense camera: '+(cfg.defCam==='def'?'Behind defense':'Behind offense');}PR=null;pres.hidden=true;hud.classList.remove('pres');cfg.present=true;cfg.stadGlb=cfg.home.stad.model&&STAD[cfg.home.stad.model.id]||null;if(window.innerHeight>window.innerWidth)setTimeout(()=>toast('Tip: turn your phone sideways for a wider view of the field.'),1500);
 for(let i=0;i<2;i++){const t=cfg[i?'away':'home'],e=$('#b'+i);e.style.setProperty('--c',t.c1);e.querySelector('b').textContent=t.abbr;e.querySelector('span').innerHTML=lg(t,26);}
 Art.ready([cfg.home.logo.img,cfg.away.logo.img,cfg.home.field.img],()=>{V.resize();V.build(cfg);G.start(Object.assign({hud:HUDI,runoff:cfg.qLen>=15?32:cfg.qLen>=10?24:cfg.qLen>=6?18:14},cfg));running=true;paused=false;last=performance.now();raf=requestAnimationFrame(frame);
  HUDI.banner(cfg.away.name.toUpperCase()+' AT '+cfg.home.name.toUpperCase(),cfg.home.stad.name+' · '+cfg.rules.name+' rules');});}
function endGame(res){PR=null;pres.hidden=true;Voice.stop();running=false;cancelAnimationFrame(raf);hud.hidden=true;app.hidden=false;document.body.classList.remove('ingame');A.quiet();const c=cur;cur=null;if(c&&c.onEnd)c.onEnd(res);}
window.addEventListener('resize',()=>V.resize());

/* live 3D model preview in the editors */
let pvYaw=Math.PI+.5,pvDrag=null,pvLast=0,pvFail=false;
function pvLoop(ts){requestAnimationFrame(pvLoop);const ms=$('#mst');if(ms&&ts-pvLoop.t>700){pvLoop.t=ts;ms.textContent='Player models: '+V.mocapStatus;}if(running||pvFail)return;const cs=app.querySelectorAll('canvas.p3d');if(!cs.length)return;const dt=Math.min(.05,Math.max(0,(ts-pvLast)/1000));pvLast=ts;if(pvDrag==null)pvYaw+=dt*.45;
 if(!V.ok&&!V.init(cv)){pvFail=true;return;}
 try{for(const c of cs){if(c.id==='s3d'){const t=editTeam();if(t)V.stadPreview(c,t,E.RULES[view.prules||'pro'],pvYaw*.6);continue;}let t,p,home=true;
   if(c.dataset.t!=null){t=EXT[+c.dataset.t];home=c.dataset.home==='1';p=t&&(E.depth(t).QB[0]||t.roster[0]);}else{t=editTeam();if(!t)continue;if(c.id==='p3d')p=findP(t,view.pid);else{p=t.roster[0];home=view.khome!==0;}}
   if(t&&p)V.preview(c,t,p,home,pvYaw,dt,c.id||('x'+c.dataset.home));}}catch(e){pvFail=true;}}
pvLoop.t=0;
app.addEventListener('pointerdown',e=>{if(e.target.classList&&e.target.classList.contains('p3d')){pvDrag=e.clientX;e.preventDefault();}});
window.addEventListener('pointermove',e=>{if(pvDrag!=null){pvYaw+=(e.clientX-pvDrag)*.012;pvDrag=e.clientX;}});window.addEventListener('pointerup',()=>{pvDrag=null;});window.addEventListener('pointercancel',()=>{pvDrag=null;});
/* ================= boot ================= */
function boot(){const s=sget(SAVE);if(s){try{L=E.unpack(s);}catch(e){L=null;}}const x=sget(EXS);if(x){try{EXT=E.unpack(x);}catch(e){EXT=null;}}if(!EXT||!EXT.length)EXT=E.exhibitionTeams('pro');
 let t=0;Art.onload=()=>{clearTimeout(t);t=setTimeout(()=>{if(!running&&!app.querySelector('input:focus'))render();},60);};
 setTimeout(()=>{try{if(!V.ok)V.init(cv);}catch(e){}},400);IDB.open().then(()=>IDB.all((k,v)=>{STAD[k]=v;}));Voice.init();render();requestAnimationFrame(pvLoop);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const tm of EXT)delete tm._lgk;if(L)for(const tm of L.teams)delete tm._lgk;render();});}
boot();
return {render,state:()=>({L,EXT,scr,tab,view}),act:ACT,packGlb};
})();
